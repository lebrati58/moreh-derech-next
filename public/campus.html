<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<meta name="description" content="אלוף הקורס — משחק קבוצתי חי עם שעון: כל הכיתה עונה יחד מהטלפון, מהירות התשובה קובעת, פודיום בסוף">
<title>🏆 אלוף הקורס — Moreh Derech NEXT</title>
<script src="comfort.js"></script>
<link rel="icon" href="assets/moreh-derech-next-driver.webp" type="image/webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0b1230;--bg2:#09112b;--card:#151f4a;--card2:#1b2757;--line:#3d5190;--ink:#eef3ff;--soft:#b5c3ee;--gold:#ffd878;--gold2:#f0b44c;--mint:#6ee9cf;--red:#ff8f8f;--ok:#18aa7b;--bad:#d85660;
  --a0:#e21b3c;--a1:#1368ce;--a2:#c98f00;--a3:#26890c;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 0 0,#2c3f9c 0,transparent 46%),radial-gradient(ellipse at 100% 38%,#352b73 0,transparent 42%),var(--bg2);background-attachment:fixed;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI','Arial Hebrew',Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
a{color:inherit}button,input{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:860px;margin:auto;padding:0 calc(14px + var(--safe-r)) calc(28px + var(--safe-b)) calc(14px + var(--safe-l))}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 0 8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:1000;text-decoration:none;font-size:15px}
.brand img{height:40px;width:40px;object-fit:contain;border-radius:12px;background:#fff;box-shadow:0 3px 0 #040717}
.pills{display:flex;gap:6px;align-items:center}
.pill{border:1px solid var(--line);background:#141d47;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:900;white-space:nowrap}
.net{display:inline-flex;align-items:center;gap:6px}
.net i{width:9px;height:9px;border-radius:50%;background:#e8b44a;display:inline-block}
.net.online i{background:#3fe0a6;box-shadow:0 0 8px #3fe0a6}.net.offline i{background:#ff6b6b}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px #0006;margin:10px 0}
h1{font-size:28px;margin:6px 0 4px;font-weight:1000;line-height:1.15}
h2{font-size:19px;margin:4px 0 10px;font-weight:1000}
.sub{color:var(--soft);font-size:14.5px;line-height:1.45;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:1000;font-size:18px;background:var(--gold);color:#1b2855;box-shadow:0 5px 0 #8a6a10;margin-top:12px;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6a10}
.btn.ghost{background:#1d2a62;color:var(--ink);box-shadow:0 4px 0 #0a1238;border:1px solid var(--line)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #188c74}
.btn.small{padding:10px 14px;font-size:15px;width:auto;margin:0}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.hero{text-align:center;padding:16px 4px 4px}
.hero .cup{font-size:64px;line-height:1;filter:drop-shadow(0 6px 12px #ffd87866);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.how div{background:#101943;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:12.5px;color:var(--soft)}
.how b{display:block;font-size:22px;margin-bottom:3px}
label.f{display:block;font-weight:900;margin:12px 0 6px;font-size:14.5px}
input.t{width:100%;border:2px solid var(--line);background:#0e1640;border-radius:14px;padding:13px 14px;font-size:19px;font-weight:900}
input.pin{text-align:center;letter-spacing:10px;font-size:32px;direction:ltr}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs button{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:#0e1640;font-size:25px;padding:0}
.avs button[aria-pressed=true]{border-color:var(--gold);background:#3a3470;transform:scale(1.08)}
.err{color:var(--red);font-weight:900;margin-top:8px;min-height:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#0e1640;border-radius:999px;padding:8px 12px;font-weight:900;font-size:14px}
.chip[aria-pressed=true]{background:var(--mint);color:#08263b;border-color:var(--mint)}
.chip small{opacity:.75;font-weight:700}
.tours{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.tours .chip{padding:7px 0;text-align:center}
.mini{font-size:13px;color:var(--soft);margin-top:6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-weight:900}
.switch input{width:22px;height:22px;accent-color:var(--mint)}
/* salle d'attente */
.pinbox{text-align:center}
.pinbox .lbl{color:var(--soft);font-weight:900}
.pinbox .big{font-size:58px;font-weight:1000;letter-spacing:8px;color:var(--gold);direction:ltr;line-height:1.1}
.qr{display:flex;justify-content:center;margin:10px 0}.qr canvas,.qr img{background:#fff;padding:8px;border-radius:14px;max-width:190px;height:auto}
.roster{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.who{display:inline-flex;align-items:center;gap:6px;background:#0e1640;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-weight:900;animation:pop .35s ease}
.who.me{border-color:var(--gold);background:#3a3470}
.who button{border:0;background:none;padding:0 0 0 2px;color:var(--red);font-size:15px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.count{font-size:15px;color:var(--soft);text-align:center;margin-top:8px}
/* question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;color:var(--soft);font-size:13.5px;margin-top:4px}
.lv{background:#0e1640;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.double{background:linear-gradient(90deg,#ffb52e,#ff5f7e);color:#fff;border-radius:14px;padding:9px 12px;text-align:center;font-weight:1000;margin-top:8px;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 22px #ff9c4f}}
.qtext{font-size:22px;font-weight:1000;line-height:1.35;margin:12px 0 4px;background:#fff;color:#14204d;border-radius:18px;padding:16px;box-shadow:0 6px 0 #0a1238}
.timer{position:relative;height:14px;border-radius:999px;background:#0e1640;border:1px solid var(--line);overflow:hidden;margin:12px 0 4px}
.timer i{position:absolute;inset:0 0 0 auto;width:100%;background:linear-gradient(90deg,var(--bad),var(--gold2),var(--mint));transform-origin:right;transition:transform .25s linear}
.tnum{display:flex;justify-content:space-between;font-weight:1000;font-size:15px}
.tnum b{font-size:24px;color:var(--gold)}
.tnum b.hot{color:var(--red);animation:beat .5s ease infinite alternate}
@keyframes beat{to{transform:scale(1.18)}}
.ready{text-align:center;font-weight:1000;font-size:18px;color:var(--gold);margin:14px 0}
.ready .ring{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;border:5px solid var(--gold);font-size:30px;margin-bottom:6px;animation:pop .4s ease}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ans button,.ans div{position:relative;min-height:92px;border:0;border-radius:18px;color:#fff;font-weight:1000;font-size:17px;line-height:1.3;padding:12px 12px 12px 40px;text-align:right;box-shadow:0 5px 0 #0007;display:flex;align-items:center}
.ans .s{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.95}
.ans .o0{background:var(--a0)}.ans .o1{background:var(--a1)}.ans .o2{background:var(--a2)}.ans .o3{background:var(--a3)}
.ans button:active{transform:translateY(3px);box-shadow:0 2px 0 #0007}
.ans .dim{opacity:.28;filter:grayscale(.6)}
.ans .pick{outline:4px solid #fff;outline-offset:2px}
.ans .good{outline:4px solid #fff;outline-offset:2px;animation:pop .4s ease}
.ans .good::after{content:'✓';position:absolute;right:-6px;top:-10px;background:#fff;color:var(--ok);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:20px}
.ans .bar{position:absolute;inset:auto 0 0 0;height:6px;background:#ffffffaa;border-radius:0 0 18px 18px;transform-origin:right}
.ans .n{position:absolute;left:10px;bottom:8px;font-size:13px;background:#0005;border-radius:999px;padding:2px 8px}
.sent{text-align:center;margin-top:14px}
.sent .big{font-size:46px}
.result{text-align:center;padding:18px 10px;border-radius:22px;margin-top:12px;color:#fff}
.result.ok{background:linear-gradient(160deg,#21c28c,#0f7c5a)}.result.bad{background:linear-gradient(160deg,#ef5a6f,#a82c3d)}.result.none{background:linear-gradient(160deg,#5869a8,#2e3b75)}
.result .em{font-size:52px;line-height:1}.result .pts{font-size:34px;font-weight:1000;margin-top:4px}
.result .det{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-weight:900;font-size:14.5px}
.result .det span{background:#0003;border-radius:999px;padding:4px 10px}
.expl{background:#101943;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.5}
.expl b{color:var(--mint)}
.rankline{text-align:center;font-weight:1000;font-size:19px;margin-top:12px}
/* classement */
.board{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.board li{display:flex;align-items:center;gap:10px;background:#0e1640;border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:1000;animation:slide .45s ease both}
.board li:nth-child(2){animation-delay:.08s}.board li:nth-child(3){animation-delay:.16s}.board li:nth-child(4){animation-delay:.24s}.board li:nth-child(5){animation-delay:.32s}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.board .r{width:30px;text-align:center;color:var(--gold);font-size:18px}
.board .a{font-size:24px}.board .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{direction:ltr}.board .d{color:var(--mint);font-size:13px;direction:ltr;margin-inline-start:6px}
.board li.me{border-color:var(--gold);background:#3a3470}
/* podium */
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:8px;margin-top:26px;min-height:300px}
.step{text-align:center;opacity:0;animation:rise .7s cubic-bezier(.2,1.4,.4,1) forwards}
.step .av{font-size:44px;line-height:1}.step .nm{font-weight:1000;font-size:16px;margin:4px 0 2px;word-break:break-word}.step .sc{color:var(--soft);font-weight:900;font-size:13.5px;direction:ltr}
.step .blk{border-radius:16px 16px 6px 6px;margin-top:8px;display:grid;place-items:center;font-size:34px;font-weight:1000;color:#1b2855}
.step.p1{animation-delay:2.1s}.step.p2{animation-delay:1.2s}.step.p3{animation-delay:.4s}
.step.p1 .blk{height:150px;background:linear-gradient(#ffe7a3,#f0b44c)}.step.p2 .blk{height:112px;background:linear-gradient(#eef3ff,#a9b6d8)}.step.p3 .blk{height:84px;background:linear-gradient(#ffc79a,#c97a3d)}
.step.p1 .av{font-size:58px}.step.p1 .crown{font-size:30px;display:block;animation:bob 2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.stats div{background:#0e1640;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13.5px;color:var(--soft)}
.stats b{display:block;color:var(--ink);font-size:16px;margin-top:2px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.hostbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hostbar .btn{flex:1;margin:0}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);background:#101943;border:1px solid var(--gold2);border-radius:14px;padding:10px 16px;font-weight:900;z-index:9;max-width:92vw;text-align:center}
.note{font-size:12.5px;color:var(--soft);margin-top:10px;line-height:1.45}
@media (min-width:760px){.qtext{font-size:30px}.ans button,.ans div{min-height:120px;font-size:21px}.host .qtext{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.step{opacity:1}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="index.html"><img src="assets/moreh-derech-next-driver.webp" alt=""><span>אלוף הקורס</span></a>
    <div class="pills">
      <span class="pill net" id="net" hidden><i></i><span id="netTxt">מתחבר…</span></span>
      <button type="button" class="pill" id="snd" aria-label="צליל">🔊</button>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="progress.js"></script>
<script src="history-data.js"></script>
<script src="campus/campus-core.js"></script>
<script src="campus/campus-net.js"></script>
<script src="campus/campus-app.js"></script>
</body>
</html>
