<body><main class="wrap">
<nav class="nav"><div style="display:flex;gap:8px"><a href="index.html">⌂ לכל המשחקים</a><a href="community-library.html">🌍 כל המסלולים</a></div><span class="brand"><img src="assets/moreh-derech-next-driver.webp" alt=""><b>MOREH DERECH NEXT</b></span></nav>
<header class="hero"><div class="eyebrow">🛣️ BUILD · PLAY · SHARE</div><h1>יוצרים קטע דרך משלכם</h1><p>כמו כביש 67: בוחרים מאיפה ולאן, מכינים שאלות ומשתפים את החברים. בלי חשבון מנהל ובלי לכתוב קוד.</p></header>
<section id="creator" class="panel">
<h2>1. מאיפה ולאן נוסעים?</h2>
<div class="line"><div><label for="from">🚩 נקודת התחלה</label><input class="field" id="from" placeholder="למשל: זכרון יעקב" maxlength="100"></div>
<div><label for="to">🏁 נקודת סיום</label><input class="field" id="to" placeholder="למשל: יקנעם עילית" maxlength="100"></div></div>
<div style="margin-top:12px"><label for="doc">📄 יש לכם סיכום סיור? צרפו (לא חובה)</label><input class="field" id="doc" type="file" accept=".docx,.pdf,.txt,.md"></div>
<p class="subtle">יצירה אוטומטית משתמשת במפת OpenStreetMap ובעובדות מוויקיפדיה/ויקינתונים. הכנת השאלות עשויה להשתנות לפי המידע שנמצא, ולכן חשוב לבדוק כל תשובה.</p>
<div class="actions"><button class="btn" id="generate">✨ בנו שאלות אוטומטית</button><button class="btn secondary" id="manual">✏️ אכין שאלות בעצמי</button></div>
<div class="status" id="status" role="status" hidden></div>
</section>
<section id="review" class="panel" hidden><h2>2. בודקים את השאלות</h2><p class="muted" id="reviewTitle"></p><div id="questionList"></div>
<div class="actions"><button class="btn tertiary" id="addQuestion">＋ הוספת שאלה</button><button class="btn tertiary" id="startOver">↶ חזרה</button></div>
<label class="box" style="display:flex;align-items:center;gap:10px;margin-top:16px"><input id="verified" type="checkbox" style="width:21px;height:21px"><span>בדקתי שהשאלות, התשובות והמקורות נכונים ומתאימים לשיתוף.</span></label>
<div class="actions"><button class="btn" id="publish" disabled>🌍 פרסום המשחק לכולם</button><button class="btn secondary" id="share" disabled>🔗 קישור אישי ללא פרסום</button><button class="btn tertiary" id="try">🎮 ניסיון משחק</button></div><p class="subtle" id="publishHint">בפרסום הציבורי המשחק מצטרף לספרייה וכולם יכולים למצוא ולשחק בו. צריך לבדוק את התוכן לפני הפרסום.</p>
<div id="sharePanel" hidden><div class="box">הקישור כולל את השאלות שבחרתם. מי שפותח אותו יכול לשחק, בלי להתחבר לאתר.</div>
<input id="linkOutput" class="field" readonly aria-label="קישור למשחק"><div class="actions"><button class="btn" id="copy">📋 העתק קישור</button><button class="btn secondary" id="send">💬 שיתוף בטלפון</button></div><p class="subtle">קישור אישי, ללא שרת וללא גישה לבסיס LIVE. הוא לא מוסיף את המשחק לרשימת 22 הסיורים הרשמית. הקישור יכול להיות ארוך כי כל השאלות כלולות בו.</p></div></section>
<section id="player" class="panel" hidden><div class="muted" id="playRoute"></div><p class="subtle" id="publicNotice" hidden>⚠️ זהו משחק של חברי הקהילה, והתוכן לא נבדק עובדתית על ידי הקורס.</p><div class="actions" id="publicControls" hidden><button class="btn tertiary" id="report" type="button">⚑ דיווח על תוכן פוגעני</button><button class="btn tertiary" id="unpublish" type="button" hidden>🗑️ הסרת המשחק שלי מהספרייה</button></div><h2 id="playTitle"></h2><p class="score" id="playProgress"></p><div id="playOptions"></div><div id="playFeedback" class="box" hidden></div><div class="actions"><button class="btn" id="nextQuestion" hidden>הבא ←</button><button class="btn secondary" id="backToEditor" hidden>↶ חזרה לעריכה</button><button class="btn tertiary" id="newRoute">🛣️ צרו מסלול חדש</button></div></section>
<section id="savedPanel" class="panel" hidden><h2>📌 המשחקים שלי בדפדפן הזה</h2><div id="savedList"></div></section>
<p class="notice">🔒 משחקי השאלות עצמם נשמרים בקישור האישי. אם מצרפים מסמך בעת יצירת המשחק, הטקסט שלו נשלח לספריית המסלולים המשותפת (כאשר שירות המסמכים פעיל). אין צורך בסיסמת מנהל. המשחק המשותף הוא תרגול עצמאי עם מעבר ידני בין השאלות, ולא משחק LIVE עם פרסום שאלות לכל האוטובוס. אין לשתף מסמכים פרטיים או תוכן שאין לכם זכות לפרסם. לנוסעים בלבד — לא משחקים בזמן נהיגה.</p>
</main>

<script src="gps-engine.js"></script><script src="auto-engine.js"></script><script src="doc-reader.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id),G=window.MDL_GPS,A=window.MDL_AUTO,MAX=25;
let draft=null,index=0,answers=[],preview=false,geoPoint=null,sharedTourId=null,attachedText="",publishedId=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function status(message,error){const e=$("status");e.hidden=!message;e.className="status"+(error?" error":"");e.textContent=message||"";}
function show(id){for(const name of ["creator","review","player"])$(name).hidden=name!==id;window.scrollTo({top:0,behavior:"auto"});}
function current(){if(!draft)throw Error("no draft");return draft.questions.filter(q=>q.on).slice(0,MAX);}
function cleanQuestion(q){return {t:String(q.t||"").trim().slice(0,240),o:(q.o||[]).map(s=>String(s||"").trim().slice(0,220)).slice(0,4),c:Number(q.c),e:String(q.e||"").trim().slice(0,600),p:String(q.p||"").trim().slice(0,100),s:String(q.s||"").trim().slice(0,500),u:String(q.u||"").trim().slice(0,400)};}
function valid(payload){return payload&&payload.v===1&&typeof payload.from==="string"&&payload.from.length<=100&&typeof payload.to==="string"&&payload.to.length<=100&&Array.isArray(payload.questions)&&payload.questions.length>0&&payload.questions.length<=MAX&&payload.questions.every(q=>typeof q.t==="string"&&q.t.length>3&&q.t.length<=240&&Array.isArray(q.o)&&q.o.length===4&&q.o.every(s=>typeof s==="string"&&s.length>0&&s.length<=220)&&Number.isInteger(q.c)&&q.c>=0&&q.c<4&&typeof q.e==="string"&&q.e.length<=600&&typeof q.p==="string"&&q.p.length<=100&&typeof q.s==="string"&&q.s.length<=500&&typeof q.u==="string"&&q.u.length<=400);}
function pack(){const qs=current().map(cleanQuestion);const payload={v:1,from:draft.from,to:draft.to,questions:qs};if(!valid(payload))throw Error("בדקו שלכל שאלה יש נוסח, 4 תשובות וסימון של תשובה נכונה");return payload;}
function qFromGenerated(res){
 return (res.questions||[]).slice(0,MAX).map(q=>{
 const st=(res.route.stops||[]).find(s=>s.id===q.key);
 const guide=q.guide_i18n&&q.guide_i18n.he||{};
 return {on:true,t:q.text||"",o:(q.options||[]).map(String),c:q.correct_index,e:q.explanation||"",p:st&&st.name&&st.name.he||"",s:guide.script||q.guide_short||"",u:(q.guide_sources||[]).find(s=>/^https:\/\//.test(s.url||""))?.url||""};
 });
}
function renderReview(){
 if(!draft)return;show("review");$("sharePanel").hidden=true;
 $("reviewTitle").textContent=draft.from+" ← "+draft.to+" · "+draft.questions.filter(q=>q.on).length+" שאלות נבחרו (עד "+MAX+")";
 const list=$("questionList");list.replaceChildren();
 draft.questions.forEach((q,i)=>{
 const card=document.createElement("div");card.className="qcard";
 card.innerHTML='<div class="qhead"><label class="qcheck"><input class="enable" type="checkbox" '+(q.on?'checked':'')+'><span>שאלה '+(i+1)+'</span></label><small>'+esc(q.p||"שאלה חדשה")+'</small></div>'+
 '<p class="qtitle">'+esc(q.t||"שאלה ללא ניסוח")+'</p>'+
 '<details class="qedit"><summary>✏️ עריכת השאלה והתשובות</summary><label>שאלה<input class="field qt" maxlength="240" value="'+esc(q.t)+'"></label>'+
 [0,1,2,3].map(j=>'<label>תשובה '+(j+1)+'<input class="field qo" maxlength="220" value="'+esc(q.o[j]||"")+'"></label>').join('')+
 '<label>התשובה הנכונה<select class="field qc">'+[0,1,2,3].map(j=>'<option value="'+j+'" '+(q.c===j?'selected':'')+'>'+(j+1)+'</option>').join('')+'</select></label>'+
 '<label>הסבר<textarea class="field qe" maxlength="600">'+esc(q.e)+'</textarea></label>'+
 '<label>שם המקום<input class="field qp" maxlength="100" value="'+esc(q.p)+'"></label>'+
 '<label>מה להגיד בהדרכה (רשות)<textarea class="field qs" maxlength="500">'+esc(q.s)+'</textarea></label>'+
 '<label>קישור למקור (רשות)<input class="field qu" maxlength="400" value="'+esc(q.u)+'"></label></details>';
 const enable=card.querySelector(".enable");enable.onchange=()=>{q.on=enable.checked;updateReviewSummary();};
 card.querySelector(".qt").oninput=e=>{q.t=e.target.value;card.querySelector(".qtitle").textContent=q.t;};
 card.querySelectorAll(".qo").forEach((e,j)=>e.oninput=()=>{q.o[j]=e.value;});
 card.querySelector(".qc").onchange=e=>{q.c=Number(e.target.value);};
 for(const [sel,key] of [[".qe","e"],[".qp","p"],[".qs","s"],[".qu","u"]])card.querySelector(sel).oninput=e=>{q[key]=e.target.value;};
 list.append(card);
 });updateReviewSummary();
}
function updateReviewSummary(){if(!draft)return;$("reviewTitle").textContent=draft.from+" ← "+draft.to+" · "+current().length+" שאלות נבחרו";$("share").disabled=!$("verified").checked||!current().length;$("publish").disabled=!$("verified").checked||!current().length;}
function startManual(){geoPoint=null;sharedTourId=null;attachedText="";const from=$("from").value.trim(),to=$("to").value.trim();if(!from||!to){status("צריך להזין התחלה וסיום",true);return;}draft={from,to,questions:[emptyQuestion()]};$("verified").checked=false;status("");renderReview();}
function emptyQuestion(){return {on:true,t:"",o:["","","",""],c:0,e:"",p:"",s:"",u:""};}
async function generate(){
 const from=$("from").value.trim(),to=$("to").value.trim();if(!from||!to){status("צריך להזין התחלה וסיום",true);return;}
 if(!A||!G){status("מנוע המסלולים לא נטען — נסו שוב או צרו שאלות בעצמכם",true);return;}
 const btn=$("generate");btn.disabled=true;status("🔎 מאתרים מסלול ומחפשים עובדות…");
 try{const res=await A.generate({G,from,to},stage=>status("📍 מכינים את המסלול… "+stage));
 geoPoint=Array.isArray(res.route.geometry)&&res.route.geometry.length?res.route.geometry[0]:null;sharedTourId=null;attachedText="";
 if($("doc").files[0]){try{const txt=await window.MDL_DOC.readFile($("doc").files[0],"");attachedText=txt;A.applyDoc(res,txt);}catch(e){status("לא הצלחנו לקרוא את המסמך. ממשיכים עם המקורות החופשיים.");}}
 const questions=qFromGenerated(res);
 if(!questions.length)throw Error("לא נמצאו מספיק עובדות למסלול הזה. נסו נקודות אחרות או הכניסו שאלות בעצמכם.");
 draft={from,to,questions};$("verified").checked=false;renderReview();
 }catch(e){status("לא הצלחנו ליצור שאלות אוטומטית. אפשר לנסות שוב או להכין שאלות באופן ידני. "+String(e.message||"").slice(0,100),true);}
 finally{btn.disabled=false;}}
function toBytes64(bytes){let str="";for(let i=0;i<bytes.length;i+=8192)str+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function fromBytes64(v){if(!/^[A-Za-z0-9_-]+$/.test(v)||v.length>80000)throw Error("bad link");const raw=atob(v.replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(raw,c=>c.charCodeAt(0));}
async function encode(p){const bytes=new TextEncoder().encode(JSON.stringify(p));if(bytes.length>100000)throw Error("מסלול גדול מדי לשיתוף");if(typeof CompressionStream!=="function")return "j"+toBytes64(bytes);const stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));return "g"+toBytes64(new Uint8Array(await new Response(stream).arrayBuffer()));}
async function decode(key){if(!key||key.length>80000)throw Error("bad link");const b=fromBytes64(key.slice(1));if(b.length>60000)throw Error("too large");const bytes=key[0]==="g"?await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer():key[0]==="j"?b:null;if(!bytes||bytes.byteLength>150000)throw Error("too large");const x=JSON.parse(new TextDecoder().decode(bytes));if(!valid(x))throw Error("bad data");return x;}
function saveLocal(p,url){try{let arr=JSON.parse(localStorage.getItem("mdl_community_routes_v1")||"[]");arr=arr.filter(x=>x.url!==url);arr.unshift({from:p.from,to:p.to,date:new Date().toISOString().slice(0,10),count:p.questions.length,url});localStorage.setItem("mdl_community_routes_v1",JSON.stringify(arr.slice(0,12)));renderSaved();}catch(e){}}
function renderSaved(){let arr=[];try{arr=JSON.parse(localStorage.getItem("mdl_community_routes_v1")||"[]");}catch(e){}$("savedPanel").hidden=!arr.length;const list=$("savedList");list.replaceChildren();for(const x of arr){const a=document.createElement("a");a.className="history-item";a.href=x.url;a.textContent="🛣️ "+x.from+" ← "+x.to+" · "+x.count+" שאלות";list.append(a);}}
async function routeLocation(from){
 if(geoPoint&&geoPoint.length===2)return {lat:Number(geoPoint[0]),lon:Number(geoPoint[1])};
 const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&q="+encodeURIComponent(from));
 if(!r.ok)throw Error("מיקום לא נמצא");const j=await r.json();if(!j.length)throw Error("מיקום לא נמצא");
 return {lat:Number(j[0].lat),lon:Number(j[0].lon)};
}

const OWNER_KEY="mdl_next_community_owner_v1",REPORT_KEY="mdl_next_community_report_v1";
function privateKey(key){
  let v="";try{v=localStorage.getItem(key)||"";if(!/^[0-9a-f-]{36}$/i.test(v)){v=crypto.randomUUID();localStorage.setItem(key,v);}}catch(e){v=crypto.randomUUID();}
  return v;
}
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function shortLink(id){const url=new URL("community.html",location.href);url.searchParams.set("id",id);return url.href;}
async function publishPublic(){
 const btn=$("publish");if(btn.disabled)return;
 let payload;try{payload=pack();}catch(e){alert(e.message);return;}
 if(!$("verified").checked)return;
 btn.disabled=true;btn.textContent="🌍 שומרים בספרייה…";
 try{
  const r=await MDL.rpc("community_publish_quiz",{p_payload:payload,p_owner_token:privateKey(OWNER_KEY)},{timeout:20000});
  if(!r||r.error||!r.ok)throw Error(r&&r.error||"publish_failed");
  const url=shortLink(r.id);publishedId=r.id;rememberOwner(r.id);saveLocal(payload,url);
  $("sharePanel").hidden=false;$("linkOutput").value=url;
  const box=$("sharePanel").querySelector(".box");box.textContent="✅ המשחק פורסם בספרייה הקהילתית. כולם יכולים למצוא אותו, לשחק ולשתף. העותק נשמר בשרת.";
  $("sharePanel").querySelector(".subtle").textContent="זהו קישור קצר וקבוע למשחק בקהילה. השאלות הן תוכן גולשים וטרם עברו אימות של הקורס.";
  $("sharePanel").scrollIntoView({block:"nearest",behavior:"smooth"});
  $("publishHint").textContent="✅ פורסם בהצלחה! "+(r.existing?"המשחק הזה כבר היה בספרייה.":"הוא מופיע עכשיו בספרייה הקהילתית.");
 }catch(e){
  const msg=String(e.message||e);
  $("publishHint").textContent=/HTTP 404|PGRST202|Could not find the function|community_publish_quiz/i.test(msg)
    ?"⚠️ הספרייה עדיין לא הופעלה ב-Supabase. יש להתקין פעם אחת את supabase/community_quizzes.sql; קישור אישי עדיין עובד."
    :"⚠️ לא הצלחנו לפרסם: "+msg+". אפשר ליצור קישור אישי.";
 }finally{btn.disabled=false;btn.textContent="🌍 פרסום המשחק לכולם";}
}
async function startPublic(id){
 try{
  const p=await MDL.rpc("community_get_quiz",{p_id:id},{timeout:14000});
  if(!valid(p))throw Error("route_not_found");
  publishedId=id;startGame(p,false);
  $("publicNotice").hidden=false;$("publicControls").hidden=false;
  $("report").hidden=false;$("unpublish").hidden=!canUnpublish(id);
 }catch(e){status("⚠️ המסלול הזה עדיין לא זמין בספרייה או שהוסר בעקבות דיווח.",true);show("creator");}
}
function canUnpublish(id){try{const owners=JSON.parse(localStorage.getItem("mdl_next_community_mine_v1")||"[]");return owners.includes(id);}catch(e){return false;}}
function rememberOwner(id){try{let arr=JSON.parse(localStorage.getItem("mdl_next_community_mine_v1")||"[]");arr.unshift(id);localStorage.setItem("mdl_next_community_mine_v1",JSON.stringify([...new Set(arr)].slice(0,60)));}catch(e){}}
$("report").onclick=async()=>{
 if(!publishedId||!confirm("האם לדווח על המשחק הזה? משתמשים אחרים עשויים להסתיר אותו אחרי כמה דיווחים."))return;
 try{const r=await MDL.rpc("community_report_quiz",{p_id:publishedId,p_reporter_token:privateKey(REPORT_KEY)},{timeout:14000});
 if(!r||r.error)throw Error(r?.error||"failed");
 $("report").disabled=true;$("report").textContent="✓ הדיווח התקבל";if(r.hidden)$("publicNotice").textContent="⚠️ המשחק הוסר מן הספרייה בעקבות דיווחי משתמשים.";
 }catch(e){alert("הדיווח לא נשמר: "+e.message);}
};
$("unpublish").onclick=async()=>{
 if(!publishedId||!confirm("להסיר את המשחק שלכם מהספרייה?"))return;
 try{const r=await MDL.rpc("community_delete_quiz",{p_id:publishedId,p_owner_token:privateKey(OWNER_KEY)},{timeout:14000});
 if(!r||r.error)throw Error(r?.error||"failed");
 location.href="community-library.html";
 }catch(e){alert("לא ניתן להסיר: "+e.message);}
};
async function share(){try{
 const p=pack();const key=await encode(p),url=new URL("community.html",location.href);url.hash="route="+key;
 $("linkOutput").value=url.href;$("sharePanel").hidden=false;saveLocal(p,url.href);
 $("linkOutput").scrollIntoView({block:"nearest",behavior:"smooth"});
 const notice=$("sharePanel").querySelector(".box");
 if(url.href.length>12000)notice.textContent="⚠️ הקישור ארוך. מומלץ לבחור פחות שאלות כדי שיהיה קל לשלוח בוואטסאפ.";
 const file=$("doc").files[0];
 if(!file){notice.textContent="🔗 משחק אישי מוכן! לא צורף מסמך, ולכן המשחק נשמר בקישור האישי בלבד. אפשר לצרף קטע דרך כדי להוסיף אותו גם לספרייה המשותפת.";return;}
 if(sharedTourId){notice.textContent="✅ המסמך כבר נשמר בספריית המסלולים. ניתן לשתף את המשחק.";return;}
 notice.textContent="📄 שומרים את המסמך במסלול חדש בספרייה המשותפת…";
 try{
  const body=attachedText||await MDL_DOC.readFile(file,"");
  if(body.length>120000)throw Error("המסמך ארוך מדי לשמירה אוטומטית (120,000 תווים).");
  const place=await routeLocation(p.from);
  const saved=await MDCommunity.submit({
   p_tour_id:"",p_title:file.name.replace(/\.[^.]+$/,"").slice(0,140)||"קטע דרך",
   p_author:"אורח",p_body:body,p_file_name:file.name,p_source_url:"",
   p_new_route_title:(p.from+" ← "+p.to).slice(0,120),
   p_place_name:p.from.slice(0,120),p_lat:place.lat,p_lon:place.lon
  });
  sharedTourId=saved.tour_id;
  const a=document.createElement("a");a.href="map.html?tour="+encodeURIComponent(saved.tour_id);a.textContent="🗺️ פתחו את המסלול ואת המסמך בספרייה";a.style.display="block";
  notice.replaceChildren(document.createTextNode("✅ המסמך נשמר במסלול החדש בספרייה המשותפת! "),a);
 }catch(e){
  notice.textContent="⚠️ המשחק האישי מוכן, אבל המסמך לא נשמר בספריית המסלולים. "+String(e.message||"שגיאת שמירה").slice(0,100)+" — ניתן להעלות אותו גם דרך ״הוספת מסמך״.";
  const a=document.createElement("a");a.href="contribute.html";a.textContent="📄 הוספת מסמך לספרייה";a.style.display="block";notice.append(a);
 }
 }catch(e){alert("⚠️ "+(e.message||"בדקו את השאלות"));}
}
function startGame(p,isPreview){preview=!!isPreview;draft={from:p.from,to:p.to,questions:p.questions.map(q=>Object.assign({on:true},q))};index=0;answers=[];show("player");$("backToEditor").hidden=!preview;$("publicNotice").hidden=true;$("publicControls").hidden=true;renderGame();}
function renderGame(){const qs=current(),q=qs[index];if(!q){show("creator");return;}$("playRoute").textContent="🚌 "+draft.from+" ← "+draft.to+" · "+(q.p||"תחנה בדרך");
 $("playTitle").textContent=q.t;$("playProgress").textContent="שאלה "+(index+1)+" / "+qs.length;const area=$("playOptions");area.replaceChildren();const a=answers[index];
 for(let j=0;j<4;j++){const b=document.createElement("button");b.type="button";b.className="answer"+(a!==undefined?(j===q.c?" correct":j===a?" wrong":""):"");b.textContent=q.o[j];b.disabled=a!==undefined;b.onclick=()=>{answers[index]=j;renderGame();};area.append(b);}
 const feedback=$("playFeedback");feedback.hidden=a===undefined;if(a!==undefined){feedback.replaceChildren();const strong=document.createElement("strong");strong.textContent=a===q.c?"✅ נכון!":"💡 התשובה הנכונה: "+q.o[q.c];feedback.append(strong);
 if(q.e){const para=document.createElement("p");para.textContent=q.e;feedback.append(para);}
 if(q.s){const p=document.createElement("p");p.textContent="🎤 למדריך: "+q.s;feedback.append(p);}
 if(q.u&&/^https?:\/\//.test(q.u)){const a=document.createElement("a");a.href=q.u;a.target="_blank";a.rel="noopener noreferrer";a.textContent="📄 מקור ↗";feedback.append(a);}}
 $("nextQuestion").hidden=a===undefined;$("nextQuestion").textContent=index===qs.length-1?"🏆 סיכום":"הבא ←";}
function result(){const qs=current();const score=qs.reduce((n,q,i)=>n+(answers[i]===q.c?1:0),0);$("playTitle").textContent="🏆 סיימתם!";$("playProgress").textContent=score+" / "+qs.length+" תשובות נכונות";$("playOptions").replaceChildren();$("playFeedback").hidden=false;$("playFeedback").textContent="כל הכבוד! אפשר לשחק שוב או לשלוח את המסלול לחברים.";$("nextQuestion").hidden=false;$("nextQuestion").textContent="↻ משחק מחדש";$("nextQuestion").onclick=()=>{index=0;answers=[];renderGame();$("nextQuestion").onclick=nextStep;};}
function nextStep(){if(index<current().length-1){index++;renderGame();}else result();}
function createNew(){preview=false;draft=null;geoPoint=null;sharedTourId=null;attachedText="";publishedId=null;index=0;show("creator");$("verified").checked=false;$("sharePanel").hidden=true;}
$("generate").onclick=generate;$("manual").onclick=startManual;$("addQuestion").onclick=()=>{if(draft.questions.length>=MAX){alert("עד "+MAX+" שאלות במסלול");return;}draft.questions.push(emptyQuestion());renderReview();};
$("startOver").onclick=()=>show("creator");$("verified").onchange=updateReviewSummary;$("share").onclick=share;$("publish").onclick=publishPublic;
$("try").onclick=()=>{try{startGame(pack(),true);}catch(e){alert(e.message);}};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("linkOutput").value);$("copy").textContent="✔ הועתק";}catch(e){$("linkOutput").focus();$("linkOutput").select();document.execCommand("copy");}};
$("send").onclick=async()=>{const url=$("linkOutput").value;if(navigator.share){try{await navigator.share({title:"קטע דרך — MOREH DERECH NEXT",url});return;}catch(e){}}location.href="https://wa.me/?text="+encodeURIComponent("🛣️ בואו לשחק במסלול שיצרתי!\n"+url);};
$("nextQuestion").onclick=nextStep;$("backToEditor").onclick=renderReview;$("newRoute").onclick=createNew;
(async()=>{renderSaved();const id=new URLSearchParams(location.search).get("id");if(id&&UUID_RE.test(id)){await startPublic(id);return;}const h=location.hash;if(h.startsWith("#route=")){try{const p=await decode(h.slice(7));startGame(p,false);}catch(e){status("⚠️ הקישור לא תקין או לא נתמך בדפדפן הזה.",true);}}})();
})();
