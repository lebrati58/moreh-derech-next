name: הדרכת דרך — coordonnées, tracés et déclenchements
# Complète content/hadracha/geo-cache.json (Wikipédia/Wikidata, OSRM avec numéros de route) puis reconstruit public/hadracha/.
# Ne publie rien aux élèves : un parcours n'est visible que s'il est « pret » ET « published: true » ET sans erreur.
on:
  push:
    paths:
      - 'content/hadracha/*.src.json'
      - 'tools/build-hadracha.mjs'
      - 'public/hadracha-engine.js'
      - '.github/workflows/hadracha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-hadracha.mjs --online | tee tools/hadracha-build.log
      - name: Commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content/hadracha/geo-cache.json public/hadracha tools/hadracha-build.log
          git diff --cached --quiet || git commit -m "data(hadracha): coordonnées Wikipédia + tracé OSRM + déclenchements"
          git push
      - run: node --test tests/hadracha.test.mjs
