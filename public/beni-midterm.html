<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מבחן אמצע – בני | מורה דרך</title><style>body{font-family:system-ui,Arial;background:#0d1730;color:#f4f6ff;margin:0}main{max-width:760px;margin:auto;padding:20px}a{color:#a9d9ff}.card{background:#182543;border:1px solid #35466c;border-radius:20px;padding:22px;margin:18px 0}.opt{display:block;width:100%;text-align:right;background:#233457;border:1px solid #526487;color:white;padding:15px;border-radius:12px;margin:10px 0;font-size:16px;cursor:pointer}.opt[aria-pressed=true]{background:#245d76;border-color:#79e5d0}button{font:inherit}.nav{display:flex;justify-content:space-between;gap:10px}.nav button,.primary{padding:12px 20px;background:#a6edda;border:0;border-radius:12px;color:#10253a;font-weight:bold;cursor:pointer}.nav button:disabled{opacity:.4}small{color:#bbc8e0}.bad{color:#ffb5ad}.good{color:#a6edda}#notice{line-height:1.6}</style></head><body><main><a href="index.html">← מורה דרך</a><h1>מבחן אמצע – בני</h1><p id="notice"></p><div class="card"><strong>שתפו את מבחן האמצע ישירות עם חברים</strong><p><button class="primary" id="shareExam">🔗 שיתוף מבחן אמצע</button> <button class="primary" id="copyExam">העתקת קישור</button></p><small id="shareStatus" aria-live="polite"></small></div><div id="app">טוען...</div></main><script>
(function(){
const url=new URL('beni-midterm.html',location.href).href;
const title='מבחן אמצע – בני | מורה דרך';
const status=document.getElementById('shareStatus');
async function copy(){try{await navigator.clipboard.writeText(url);status.textContent='הקישור הועתק: '+url;}catch(e){window.prompt('העתיקו את הקישור:',url);}}
document.getElementById('copyExam').addEventListener('click',copy);
document.getElementById('shareExam').addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({title,text:'בואו לתרגל את מבחן האמצע של בני',url});}catch(e){if(e.name!=='AbortError')await copy();}}else await copy();});
})();
</script><script src="beni-midterm.js"></script></body></html>
