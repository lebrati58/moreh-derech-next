name: Jérusalem 3D — géographie
# Régénère public/jerusalem3d/geo.json (repères Wikipédia, tracés OpenStreetMap, relief SRTM).
# Lancement manuel : Actions → « Jérusalem 3D — géographie » → Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-jerusalem3d.mjs | tee tools/jerusalem3d-build.log
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jerusalem3d/geo.json tools/jerusalem3d-build.log
          git diff --cached --quiet || git commit -m "data(jerusalem3d): regenerate geo.json"
          git pull --rebase && git push
