name: אתגר המבחן — temps de trajet (OSRM)
on:
  push:
    paths: ['tools/exam-drive-times.mjs', '.github/workflows/exam-drive.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/exam-drive-times.mjs public/exam/golan-south.json | tee drive.log
      - run: echo "::notice title=drive-json::$(node -e "process.stdout.write(JSON.stringify(require('./public/exam/golan-south.drive.json')))")"
