name: One-time community database read check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-community-db.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify actual Supabase RPC (read only)
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const sandbox = {window:{}};
          vm.runInNewContext(fs.readFileSync('public/config.js','utf8'),sandbox);
          const cfg = sandbox.window.MDL_CONFIG;
          if(!cfg?.url || !cfg?.anonKey)throw Error('Missing application Supabase configuration');
          (async () => {
            const rsp = await fetch(cfg.url+'/rest/v1/rpc/community_catalog',{
              method:'POST',
              headers:Object.assign({'Content-Type':'application/json',apikey:cfg.anonKey},
                /^eyJ/.test(cfg.anonKey)?{Authorization:'Bearer '+cfg.anonKey}:{}),
              body:'{}',signal:AbortSignal.timeout(12000)
            });
            const data = await rsp.json().catch(()=>null);
            const schemaOkay = !!data && Array.isArray(data.routes) && Array.isArray(data.documents);
            console.log('Server response:',rsp.status,'readable catalog:',schemaOkay,
              'routes:',schemaOkay?data.routes.length:'unknown','documents:',schemaOkay?data.documents.length:'unknown');
            if(!rsp.ok || !schemaOkay){
              console.error('RPC error code:',typeof data?.code==='string'?data.code:'unknown');
              console.error('RPC diagnosis:',rsp.status===404?'Function missing or schema cache unavailable':rsp.status===401?'Authorization or API key failure':'Database RPC unavailable');
              process.exitCode=1;
            }
          })().catch(e=>{console.error('Read-only check failed:',e.message);process.exitCode=1;});
          NODE
