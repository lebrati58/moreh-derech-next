<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חידון חזרה באוטובוס | מורה דרך</title><style>body{margin:0;background:#0b1530;color:#f4f6ff;font:18px system-ui,Arial,sans-serif}main{max-width:650px;margin:auto;padding:22px}a{color:#9ce8df}h1{font-size:30px}p{line-height:1.6}.card{background:#1c2b50;border:1px solid #425b88;border-radius:20px;padding:22px;margin:20px 0}.muted{color:#bdcbe2}.choice{display:block;width:100%;text-align:right;margin:12px 0;padding:17px;border-radius:14px;background:#293e69;color:white;border:2px solid #506a9b;font-size:18px;cursor:pointer}.choice:disabled{opacity:.85}.choice.correct{border-color:#79e6b1;background:#195447}.choice.wrong{border-color:#ff9e9e;background:#673b4b}.primary{padding:15px 25px;border:0;border-radius:13px;background:#f9d477;color:#19213a;font-size:18px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.4}.hidden{display:none}.progress{height:9px;background:#344569;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#8de3c8;transition:width .2s}.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#explanation{border-right:4px solid #f9d477;padding-right:14px;margin-top:20px}button:focus-visible{outline:3px solid #f9d477;outline-offset:3px}</style></head><body><main><a href="index.html">← מורה דרך</a><h1>🚌 חידון חזרה בדרך הביתה</h1><p class="muted" id="subtitle">שאלות מכל מה שלמדנו בסיור היום</p><section id="loading">טוען את שאלות הסיור…</section><section id="start" class="card hidden"><p id="intro"></p><button class="primary" id="begin">מתחילים!</button></section><section id="play" class="hidden"><div class="meta"><span id="counter"></span><span id="score"></span></div><div class="progress" aria-hidden="true"><div id="bar"></div></div><div class="card"><p class="muted" id="stop"></p><h2 id="question"></h2><div id="choices"></div><div id="explanation" class="hidden" aria-live="polite"></div><button class="primary hidden" id="next">השאלה הבאה ←</button></div></section><section id="finish" class="card hidden" aria-live="polite"><h2>🏁 סיימנו!</h2><p id="result"></p><div id="review"></div><button class="primary" id="again">משחק חדש</button></section></main><script>
const $=id=>document.getElementById(id);const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};let questions=[],index=0,points=0,mistakes=[];const file=new URLSearchParams(location.search).get('date')||'2026-11-12';if(!/^20\d{2}-\d{2}-\d{2}$/.test(file)){$('loading').textContent='תאריך לא תקין';}else fetch('return-bus/'+file+'.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('not found');return r.json()}).then(data=>{questions=data.questions||[];if(!questions.length)throw Error('empty');$('subtitle').textContent=data.title;$('intro').textContent=questions.length+' שאלות · מכל תחנות הסיור · סדר אקראי';$('loading').classList.add('hidden');$('start').classList.remove('hidden')}).catch(()=>{$('loading').textContent='השאלון עדיין לא זמין לתאריך הזה.'});
function start(){questions=shuffle(questions);index=0;points=0;mistakes=[];$('start').classList.add('hidden');$('finish').classList.add('hidden');$('play').classList.remove('hidden');show()}
function show(){const q=questions[index];$('counter').textContent=(index+1)+' / '+questions.length;$('score').textContent=points+' נקודות';$('bar').style.width=(index/questions.length*100)+'%';$('stop').textContent=q.stop==='pater-noster'?'כנסיית פאטר נוסטר':q.stop==='bethphage'?'בית פגי':q.stop||'';$('question').textContent=q.question;$('choices').replaceChildren();$('explanation').classList.add('hidden');$('next').classList.add('hidden');const options=shuffle(q.options.map((value,i)=>({value,correct:i===q.correct})));for(const opt of options){const b=document.createElement('button');b.className='choice';b.textContent=opt.value;b.onclick=()=>answer(opt.correct,b,options);$('choices').append(b)}}
function answer(correct,clicked,options){const q=questions[index];for(const b of $('choices').children){b.disabled=true;const o=options.find(x=>x.value===b.textContent);if(o?.correct)b.classList.add('correct')}if(correct)points++;else{clicked.classList.add('wrong');mistakes.push(q)}$('score').textContent=points+' נקודות';$('explanation').textContent=(correct?'✅ נכון! ':'❌ התשובה הנכונה: '+q.options[q.correct]+'. ')+(q.explanation||'');$('explanation').classList.remove('hidden');$('next').textContent=index===questions.length-1?'לסיכום ←':'השאלה הבאה ←';$('next').classList.remove('hidden')}
function next(){index++;if(index<questions.length)return show();$('play').classList.add('hidden');$('finish').classList.remove('hidden');$('result').textContent=points+' / '+questions.length+' תשובות נכונות';$('review').replaceChildren();if(mistakes.length){const h=document.createElement('h3');h.textContent='לחזרה ('+mistakes.length+')';$('review').append(h);for(const q of mistakes){const p=document.createElement('p');p.textContent=q.question+' — '+q.options[q.correct];$('review').append(p)}}}
$('begin').onclick=start;$('next').onclick=next;$('again').onclick=start;
</script></body></html>
