<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<meta name="description" content="ספריית רט״ג — מדריכים, עלונים, מפות ופעילויות של רשות הטבע והגנים, עם חיפוש לפי אתר, אזור, תקופה ונושא">
<title>🌿 ספריית רט״ג — Moreh Derech NEXT</title>
<link rel="icon" href="assets/moreh-derech-next-driver.webp" type="image/webp">
<style>
:root{--bg2:#09112b;--card:#151f4a;--line:#3d5190;--line2:#4c5e9a;--ink:#eef3ff;--soft:#b5c3ee;--gold:#ffd878;--gold2:#f0b44c;--mint:#6ee9cf;--green:#5fd18b;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 0 0,#1f6b4f 0,transparent 46%),radial-gradient(ellipse at 100% 38%,#2b3f8c 0,transparent 42%),var(--bg2);background-attachment:fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;line-height:1.5}
a{color:inherit}button,input,select{font:inherit;color:inherit}[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.shell{max-width:860px;margin:auto;padding:0 14px calc(90px + var(--safe-b))}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-t)) 0 10px}
.mini{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:900;text-decoration:none}.mini img{height:44px;width:44px;border-radius:12px;background:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:44px;text-decoration:none;font-size:13px;font-weight:800;padding:9px 11px;border-radius:12px;background:#1d2a56;border:1px solid var(--line2)}
.hero{border-radius:22px;padding:16px 18px;margin-top:6px;background:linear-gradient(115deg,#11744f,#1f5f86 55%,#3b3fa8);border:1px solid #8ff0c080;box-shadow:0 7px 0 #04121a}
.eyebrow{font-size:11px;letter-spacing:3px;color:#d9ffe9;font-weight:1000}.hero h1{font-size:clamp(22px,6vw,32px);margin:4px 0}.hero p{margin:0;color:#e3f6ff;font-size:14px}
.search{display:flex;gap:8px;margin-top:12px}.search input{flex:1;min-width:0;min-height:50px;border-radius:14px;border:2px solid var(--line2);background:#0f1840;padding:10px 14px;font-size:16px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.filters::-webkit-scrollbar{display:none}
.filters select{flex:none;min-height:42px;border-radius:999px;border:1px solid var(--line2);background:#16224d;padding:6px 12px;font-size:13.5px;max-width:60vw}
.tg{flex:none;min-height:42px;border-radius:999px;border:1px solid var(--line2);background:#16224d;padding:6px 12px;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.tg[aria-pressed=true]{background:var(--mint);color:#0d3a33;border-color:#a7fff0}
.count{color:var(--soft);font-size:13px;margin:10px 2px 4px}
.list{display:grid;gap:9px}
.doc{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-bottom:3px solid #2b3a73;border-radius:16px;padding:12px 13px}
.doc.guide{border-inline-start:6px solid var(--green)}
.doc b{display:block;font-size:15.5px;line-height:1.35}.doc small{display:block;color:var(--soft);font-size:12.5px;margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.bd{display:inline-block;font-size:11.5px;font-weight:900;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:#0f1840}
.bd.g{border-color:#5fd18b;color:#bff7d4}.bd.w{border-color:#f0b44c;color:#ffe2a6}.bd.x{border-color:#ff8f8f;color:#ffd0d0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.card h2{margin:0 0 8px;font-size:17px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}.kv dt{color:var(--soft)}.kv dd{margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:15px;font-weight:900;font-size:16px;border:0;padding:12px;background:var(--gold);color:#202143;text-decoration:none;margin-top:12px}
.btn.ghost{background:#293866;color:#f1f3ff;border:2px solid #546aac}
.links{display:grid;gap:7px}.links a{display:block;text-decoration:none;padding:10px 12px;border-radius:12px;background:#0f1840;border:1px solid var(--line);font-size:14px}
.note{font-size:12.5px;color:var(--soft);margin-top:10px;line-height:1.55}
.fact{padding:9px 11px;border-radius:12px;background:#0f1840;border:1px solid var(--line);margin-top:7px;font-size:14px}.fact small{display:block;color:var(--soft);font-size:12px}
.empty{border:1px dashed var(--line2);border-radius:16px;padding:18px;text-align:center;color:var(--soft);margin-top:12px}
.more{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line2);background:#16224d;margin-top:10px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><a class="mini" href="index.html"><img src="assets/moreh-derech-next-driver.webp" alt="" width="44" height="44"><span>Moreh Derech NEXT</span></a><a class="chip" id="back" href="#/">📚 <span data-t="all">כל הספרייה</span></a></header>
  <main id="view"><p class="empty">טוען…</p></main>
</div>
<script src="config.js"></script>
<script src="rtg-app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});</script>
<script src="tabbar.js"></script>
</body>
</html>
