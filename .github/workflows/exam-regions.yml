name: אתגר המבחן — régions (coordonnées Wikipédia + trajets OSRM)
# Complète public/exam/<région>.json à partir de content/exam/<région>.src.json. Le résultat est aussi publié
# en annotations (si le push du bot est refusé) pour être récupéré et commité à la main.
on:
  push:
    paths: ['content/exam/*.src.json', 'tools/exam-region-build.mjs', '.github/workflows/exam-regions.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for f in content/exam/*.src.json; do node tools/exam-region-build.mjs $(basename $f .src.json) --online; done | tee exam-build.log
      - name: Log (annotation unique)
        run: echo "::notice title=exam-log::$(grep -E '🟢|🟡|❌|⚠️' exam-build.log | head -60 | gzip -9 | base64 -w0)"
      - name: Cache géo (annotations ≤ 4096 car., max 10 par étape ; le reste se reconstruit en local depuis ce cache)
        run: gzip -9c content/exam/geo-cache.json | base64 -w0 | fold -w 4000 | nl -nln -w1 -s'|' | head -10 | while IFS= read -r l; do echo "::notice title=exam-geo::$l"; done
      - name: Commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/exam content/exam/geo-cache.json; git diff --cached --quiet || git commit -m "data(exam): coordonnées + trajets des régions"; git push
