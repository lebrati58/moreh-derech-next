<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<meta name="description" content="סיפורי דרך — מסלולי הסיורים על המפה, עם הסברי המורה מתוך ההקלטה, מצב לימוד ומצב מבחן">
<title>🛣️ סיפורי דרך — Moreh Derech NEXT</title>
<link rel="icon" href="assets/moreh-derech-next-driver.webp" type="image/webp">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{--bg:#0b1230;--bg2:#09112b;--card:#151f4a;--line:#3d5190;--line2:#4c5e9a;--ink:#eef3ff;--soft:#b5c3ee;--gold:#ffd878;--gold2:#f0b44c;--mint:#6ee9cf;--red:#ff8f8f;--ok:#18aa7b;--bad:#d85660;--qink:#1b2855;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 0 0,#2c3f9c 0,transparent 46%),radial-gradient(ellipse at 100% 38%,#352b73 0,transparent 42%),var(--bg2);background-attachment:fixed;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI','Arial Hebrew',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:820px;margin:auto;padding:0 14px calc(90px + var(--safe-b))}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-t)) 0 10px;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:900;text-decoration:none}.mini img{height:44px;width:44px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #040717}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:44px;text-decoration:none;font-size:13px;font-weight:800;padding:9px 11px;border-radius:12px;background:#1d2a56;border:1px solid var(--line2)}
.hero{border-radius:22px;position:relative;overflow:hidden;padding:16px 18px;margin-top:10px;background:linear-gradient(115deg,#0f6f7a,#2b3fa8 60%,#5b37b8);border:1px solid #7fe9dc80;box-shadow:0 7px 0 #070c26}
.eyebrow{font-size:11px;letter-spacing:3px;color:#ffe49b;font-weight:1000}
.hero h1{font-size:clamp(22px,6vw,32px);margin:4px 0;line-height:1.2}.hero p{margin:0;color:#e3ecff;font-size:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 5px 0 #050b1c}
.card h2{margin:0 0 8px;font-size:17px}
.tlist{display:grid;gap:10px;margin-top:12px}
.titem{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-bottom:3px solid #2b3a73;border-radius:18px;padding:13px}
.titem .n{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-weight:1000;font-size:20px;background:var(--gold);color:#1c1f45}
.titem b{display:block;font-size:16px}.titem small{display:block;color:var(--soft);font-size:12.5px;margin-top:2px}
.badge{display:inline-block;font-size:11.5px;font-weight:900;border-radius:999px;padding:3px 9px;margin-top:5px;border:1px solid var(--line);background:#0f1840}
.badge.pret{border-color:#3fbf8a;color:#a6f5d2}.badge.a_verifier{border-color:#f0b44c;color:#ffe2a6}.badge.en_analyse,.badge.a_importer{color:#c9d4ff}
.draft{margin-top:12px;border-radius:14px;padding:11px 13px;background:#3a2a00;border:2px solid #f0b44c;color:#ffe9b8;font-size:13.5px;line-height:1.55}
#map{height:min(46vh,360px);border-radius:18px;border:1px solid var(--line);margin-top:12px;background:#0d1838;z-index:1}
.osm-dark{filter:invert(1) hue-rotate(200deg) brightness(.95) contrast(.9) saturate(.6)}
.nomap{margin-top:12px;border:1px dashed var(--line2);border-radius:18px;padding:18px;text-align:center;color:var(--soft);font-size:14px}
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:1000;font-size:13px;background:#1d2a56;color:#fff;border:3px solid #ffd878;box-shadow:0 3px 0 #050a1f}
.pin.cur{background:#ffd878;color:#1c1f45;transform:scale(1.25)}.pin.done{border-color:#6ee9cf}.pin.mute{opacity:.45}
.pin.target{background:#ff8f8f;color:#2a0b12;border-color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px #ff8f8f44}}
.bus{font-size:26px;filter:drop-shadow(0 3px 2px #0009)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:start;text-decoration:none;border-radius:18px;padding:14px;min-height:110px;border:2px solid #44578c;background:#202d58}
.mode b{font-size:18px}.mode small{color:var(--soft);font-size:12.5px;line-height:1.45}
.mode.exam{background:linear-gradient(130deg,#5a2e00,#3a2f99);border-color:#ffd87899}
.srcs{display:grid;gap:7px;margin-top:8px}
.srcs a,.srcs div{display:block;text-decoration:none;font-size:13.5px;line-height:1.5;padding:9px 11px;border-radius:12px;background:#0f1840;border:1px solid var(--line)}
.rides{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rides button,.ctl button{min-height:44px;border-radius:12px;border:1px solid #4f62a0;background:#18244f;font-weight:850;font-size:13.5px;padding:8px 12px}
.rides button[aria-pressed=true]{background:var(--mint);color:#123b48;border-color:#a7fff0}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--soft)}
.stopbar{display:flex;align-items:center;gap:8px;margin-top:12px}
.stopbar button{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line2);background:#1d2a56;font-size:22px;font-weight:900}
.stopbar button:disabled{opacity:.3}
.stopbar .t{flex:1;min-width:0;text-align:center}.stopbar .t b{display:block;font-size:18px}.stopbar .t small{color:var(--soft);font-size:12.5px}
.side{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;background:#0f1840;border:1px solid var(--line);font-weight:800}
.side .arrow{font-size:28px;line-height:1}
.side.warn{border-color:#f0b44c}
.quote{margin:8px 0;padding:10px 12px;border-inline-start:4px solid var(--mint);background:#0f1840;border-radius:10px;font-size:15px;line-height:1.7}
.quote small{display:block;color:var(--soft);font-size:12px;margin-top:3px}
.look{color:#cfe0ff;font-size:14px;margin:6px 0 0}
.q{background:#fff;color:var(--qink);border-radius:20px;padding:16px;margin-top:12px;border:2px solid #d4daf7;box-shadow:0 6px 0 #070b20}
.q .qtag{display:inline-block;font-size:12px;font-weight:900;color:#3d3a8a;background:#e4e2ff;border-radius:999px;padding:4px 10px}
.q h3{font-size:clamp(18px,4.8vw,23px);line-height:1.45;margin:10px 0 12px}
.q h3:focus{outline:0}
.ans{display:block;width:100%;text-align:start;border:2px solid #d6ddf3;background:#eff2fc;box-shadow:0 4px 0 #bac4df;border-radius:14px;padding:13px 12px;font-size:16px;font-weight:850;color:#202c53;margin-top:9px;min-height:54px}
.ans:hover:not(:disabled),.ans:focus-visible{border-color:#5b61d9}.ans:disabled{cursor:default}
.ans.correct{background:#bffce5;border-color:var(--ok);box-shadow:0 4px 0 #0b9369}.ans.wrong{background:#ffe1df;border-color:var(--bad);box-shadow:0 4px 0 #a23f4d}
.ans.picked{background:#e4e7ff;border-color:#5b61d9}.ans.dim{opacity:.55}
.fb{border-radius:14px;padding:12px;margin-top:12px;line-height:1.6;font-size:14.5px;background:#f8f2d9;border:2px solid #f6d788;color:#554017}
.fb.good{background:#e3fbf1;border-color:#8be0c0;color:#0f4d3a}.fb.bad{background:#fff0ee;border-color:#f3b3b0;color:#6a1f26}
.fb .s{display:block;margin-top:8px;padding:8px 10px;border-radius:10px;background:#ffffffaa;font-size:13.5px}
.fb a{color:#3f3ab0;font-weight:800}
.btn{min-height:52px;border-radius:15px;font-weight:900;font-size:16px;border:2px solid #546aac;padding:12px;background:#293866;color:#f1f3ff;text-decoration:none;display:grid;place-items:center}
.btn.go{background:var(--gold);color:#202143;border:0;box-shadow:0 5px 0 #b77f31}
.btn:disabled{opacity:.35}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-weight:900}
.hud .s{background:#0f1840;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:84px;text-align:center}
.hud .s span{display:block;font-size:11px;color:var(--soft)}.hud .s strong{font-size:20px;color:var(--gold);direction:ltr;unicode-bidi:isolate}
.timebar{height:8px;border-radius:9px;background:#263662;overflow:hidden;margin-top:8px}.timebar span{display:block;height:100%;background:var(--mint);transition:width .1s linear}
.timebar.urgent span{background:var(--red)}
.paused{margin-top:12px;text-align:center;padding:20px;border-radius:18px;background:#0b1230;border:1px solid var(--line2)}
.res{text-align:center}.res .big{font-size:52px;font-weight:1000;color:var(--gold);direction:ltr}
.corr{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:9px;text-align:start}
.corr li{background:#0f1840;border:1px solid var(--line);border-inline-start:5px solid var(--bad);border-radius:14px;padding:11px 12px;font-size:14px;line-height:1.55}
.corr li.ok{border-inline-start-color:var(--ok)}
.corr b{display:block;font-size:15px}.corr .src{display:block;margin-top:6px;color:var(--soft);font-size:12.5px}.corr a{color:#a6f5e4}
.foot{font-size:12px;line-height:1.65;color:#a6b7df;margin-top:22px}
@media(max-width:420px){.modes{grid-template-columns:1fr}.mode{min-height:0}.mini span{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="mini" href="index.html" aria-label="Moreh Derech NEXT"><img src="assets/moreh-derech-next-driver.webp" alt="" width="44" height="44"><span>MOREH DERECH NEXT</span></a>
    <div style="display:flex;gap:7px"><a class="chip" href="#/" id="toList">🛣️ כל המסלולים</a><button type="button" class="chip" data-feedback>💡</button></div>
  </header>
  <p class="sr" id="live" aria-live="polite"></p>
  <main id="view" aria-live="off"></main>
  <div id="mapWrap" hidden><div id="map" role="region" aria-label="מפת המסלול"></div></div>
  <section id="below"></section>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="gps-engine.js"></script>
<script src="tour-engine.js"></script>
<script src="config.js"></script>
<script src="progress.js"></script>
<script src="feedback.js" data-float="0"></script>
<script src="parcours-app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});</script>
<script src="tabbar.js"></script>
</body>
</html>
