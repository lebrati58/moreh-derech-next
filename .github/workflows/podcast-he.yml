name: podcast-he
# Podcast Mamilla en hébreu : l'environnement de travail n'a pas accès à Hugging Face, ce job si.
on:
  push:
    branches: [claude/podcast-he]
    paths: ['tools/podcast/**', '.github/workflows/podcast-he.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q phonikud-tts
      - name: Modèles
        run: |
          mkdir -p m
          wget -q -O m/phonikud.onnx https://huggingface.co/thewh1teagle/phonikud-onnx/resolve/main/phonikud-1.0.int8.onnx
          wget -q -O m/shaul.onnx https://huggingface.co/thewh1teagle/phonikud-tts-checkpoints/resolve/main/shaul.onnx
          wget -q -O m/model.onnx https://huggingface.co/thewh1teagle/phonikud-tts-checkpoints/resolve/main/model.onnx
          wget -q -O m/model.config.json https://huggingface.co/thewh1teagle/phonikud-tts-checkpoints/resolve/main/model.config.json
      - run: python tools/podcast/gen_he_lent.py
      - name: MP3
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -v error -y -i narrateur_lent.wav -af "loudnorm=I=-16:TP=-1.5:LRA=11" -ar 44100 -ac 1 -c:a libmp3lame -b:a 96k tools/podcast/out/mamilla_podcast_he_narrateur_lent.mp3
          ffprobe -v error -show_entries format=duration -of csv=p=0 tools/podcast/out/mamilla_podcast_he_narrateur_lent.mp3
      - name: Dépôt sur la branche
        run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add tools/podcast/out && git commit -m "Podcast hébreu narrateur lent + phonèmes [skip ci]" && git push
