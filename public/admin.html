<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<script src="access-gate.js"></script>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מורה דרך">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4a6b">
<meta name="robots" content="noindex, nofollow">
<title>מנהל המשחק — מורה דרך LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap&subset=hebrew" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="next-theme.css">
<style>/* animateur (numéro) : seulement mener le quiz — les outils d'administration sont cachés */
body.host [data-a="edit"],body.host [data-a="newq"],body.host [data-a="del"],body.host [data-a="up"],body.host [data-a="down"],body.host [data-a="export"],body.host [data-a="solo-share"]{display:none!important}</style>
<link rel="icon" type="image/webp" href="assets/moreh-derech-next-driver.webp">
</head>
<body>
<div id="banner" class="banner hidden">אין חיבור — מנסה להתחבר מחדש…</div>
<header class="hero">
  <div class="hero-inner">
    <div class="brand"><a class="brand-home" href="index.html" title="כל המצבים" aria-label="Moreh Derech NEXT"><img class="brand-mark" src="assets/moreh-derech-next-driver.webp" alt="" width="44" height="44" decoding="async"></a><span>מנהל המשחק</span><span class="live"><span class="dot"></span> LIVE</span><a href="inbox.html" title="הודעות מהתלמידים" aria-label="הודעות מהתלמידים" style="margin-inline-start:8px;text-decoration:none;font-size:20px">📨</a></div>
    <div id="hdr-chip" class="chip hidden"></div>
  </div>
  <svg class="land" viewBox="0 0 400 46" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 30 L40 14 L70 24 L110 6 L150 22 L190 12 L230 26 L260 16 L300 28 L340 18 L400 30 V46 H0Z" fill="#3f6b35" opacity=".9"/>
    <path d="M0 36 Q100 28 200 36 T400 34 V46 H0Z" fill="#f7f1e5"/>
  </svg>
</header>

<main id="app"><div class="card center muted">טוען…</div></main>

<nav id="tabs" class="tabs hidden">
  <button data-view="live" class="active"><span class="i">📡</span>שידור חי</button>
  <button data-view="questions"><span class="i">📝</span>שאלות</button>
  <button data-view="gallery" id="tab-route"><span class="i">📷</span><span>מסלול</span></button>
  <button data-view="board"><span class="i">🏆</span>דירוג</button>
  <button data-view="settings"><span class="i">⚙️</span>הגדרות</button>
</nav>
<div id="modal-root"></div>
<div id="guide-root"></div>
<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="gps-engine.js"></script>
<script src="admin-nav.js"></script>
<script>
(function () {
  const { rpc, esc, store, SHAPES } = MDL;
  const KEY = 'mdl_admin';
  const app = document.getElementById('app');
  const tabs = document.getElementById('tabs');
  const banner = document.getElementById('banner');
  const chip = document.getElementById('hdr-chip');

  // Deux façons d'entrer : ADMIN (mot de passe, tous les droits) ou ANIMATEUR (numéro de la liste, via access-gate.js :
  // seulement mener le quiz en direct). admin.html?login=admin force la connexion par mot de passe.
  const forceAdmin = /[?&]login=admin\b/.test(location.search);
  const hostToken = () => { try { return (JSON.parse(localStorage.getItem('mdl_access_v1')) || {}).token || ''; } catch { return ''; } };
  let token = store.get(KEY) || (forceAdmin ? null : hostToken() || null);
  const isHost = () => !!token && token !== store.get(KEY);
  const markHost = () => document.body.classList.toggle('host', isHost());
  markHost();
  const launchMode = new URLSearchParams(location.search).get('mode');
  const simulationLaunch = launchMode === 'simulation';
  let S = null, offset = 0, view = simulationLaunch ? 'gallery' : 'live', pickId = null, timer = null, failures = 0, lastHash = '', busy = false, routeMode = simulationLaunch, nav = null, backupOpen = false,
    busMode = !simulationLaunch && store.get('mdl_busmode') !== false;   // V3 : écran « mode bus » par défaut
  // Panneau micro : état + dernière question pour laquelle il s'est ouvert automatiquement
  let G = { open: false, qid: null, mode: 'short', live: false };
  let lastAutoGuide = store.get('mdl_last_auto_guide');
  // V2 : langue d'affichage des CONTENUS dans l'admin (questions, scripts, anecdotes). Hébreu par défaut.
  const ALANGS = { he: { n: 'עב', dir: 'rtl' }, fr: { n: 'FR', dir: 'ltr' }, en: { n: 'EN', dir: 'ltr' }, ru: { n: 'RU', dir: 'ltr' } };
  let alang = ALANGS[store.get('mdl_admin_lang')] ? store.get('mdl_admin_lang') : 'he';
  // Galerie photo (fiches privées) : chargée à la demande via admin_photos, copie locale pour le hors-ligne
  let P = store.get('mdl_photos') || null, gpos = +(store.get('mdl_gal_pos') || 0), showAnec = false, gcol = null;
  const SIDE = {
    right_probable: '➡️ ימין (סביר)', right_from_route_notes: '➡️ ימין (לפי סיכום המסלול)',
    left_from_route_notes: '⬅️ שמאל (לפי סיכום המסלול)', nearby_not_visible: '📍 בסביבה — לא בהכרח נראה',
    side_uncertain: '↔️ צד לא ודאי', uncertain: '↔️ צד לא ודאי'
  };
  const CONF = { high: 'זיהוי: גבוה', medium: 'זיהוי: בינוני — לאמת', low: 'זיהוי: נמוך — לא לקבוע בוודאות' };
  const ANEC_LBL = { he: 'מידע נוסף', fr: 'En savoir plus', en: 'More info', ru: 'Подробнее' };
  const photoDir = col => 'photos/' + String(col || 'ALLER_V2').toLowerCase().replace(/_/g, '-') + '/';
  const photoUrl = (file, thumb, col) => photoDir(col) + (thumb ? 'thumbs/' : '') + encodeURIComponent(file);
  // Contenu d'une question dans la langue admin choisie (repli : hébreu)
  function qt(q) {
    const tr = alang !== 'he' && q && q.i18n && q.i18n[alang];
    const ok = tr && Array.isArray(tr.options) && tr.options.length === q.options.length;
    return ok ? { text: tr.text, options: tr.options, explanation: tr.explanation || '', category: tr.category || q.category, lang: alang }
              : { text: q.text, options: q.options, explanation: q.explanation, category: q.category, lang: 'he' };
  }
  const dirOf = l => `lang="${l}" dir="${ALANGS[l] ? ALANGS[l].dir : 'auto'}"`;
  const gtr = q => (q && q.guide_i18n && (q.guide_i18n[alang] || q.guide_i18n.he)) || {};
  const gLang = q => q && q.guide_i18n && q.guide_i18n[alang] ? alang : 'he';
  const knownBank = code => !!(S && (S.banks || []).some(x => x.code === code));
  // banque « parcours » : V3 (route 67) ou un parcours V4 généré automatiquement (code A + date)
  const routeBank = code => code === 'V3' || /^A\d/.test(code || '');
  const bankIcon = code => ({ V1: '📝', V2: '📷', V3: '🧭' })[code] || (/^A\d/.test(code || '') ? '✨' : '🗂️');
  const bankLabel = code => { const b = S && (S.banks || []).find(x => x.code === code); return b ? (b.label.he || code) : code; };
  const langSeg = () => `<div class="langseg" role="tablist" aria-label="שפת התוכן">${Object.keys(ALANGS).map(l =>
    `<button type="button" data-alang="${l}" class="${l === alang ? 'on' : ''}">${ALANGS[l].n}</button>`).join('')}</div>`;
  const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const VIS = {
    visible: '👁️ נראה מהאוטובוס',
    check: '👀 אמור להיראות מהחלון',
    nearby: '📍 אתר בסביבה — לא נראה מהכביש',
    topic: '💡 נושא כללי'
  };
  // Banque de questions : en mémoire, sinon dernière copie sauvegardée sur le téléphone (hors ligne)
  const bank = () => (S && S.questions) || store.get('mdl_bank') || [];

  const CATS = ['גאולוגיה', 'היסטוריה', 'גאוגרפיה', 'ארכאולוגיה', 'טבע', 'בוטניקה', 'זואולוגיה', 'תרבות', 'יישובים', 'כללי'];
  const DIFF = { 1: 'קל', 2: 'בינוני', 3: 'קשה' };
  const ERR = {
    question_open: 'יש שאלה פתוחה — סגרו אותה קודם.', already_used: 'השאלה כבר הוצגה במשחק הזה.',
    finished: 'המשחק הסתיים. לחצו "המשך משחק" או צרו משחק חדש.', no_game: 'אין משחק פעיל.',
    options: 'צריך בין 2 ל-4 תשובות.', correct_index: 'סמנו את התשובה הנכונה.', text: 'חסר טקסט לשאלה.',
    not_found: 'השאלה לא נמצאה.', wrong_bank: 'השאלה שייכת לגרסה אחרת — לא ניתן לפרסם אותה במשחק הזה.',
    spare_disabled: 'שאלה חלופית — הפעילו אותה קודם (🔁).', not_spare: 'זו אינה שאלה חלופית.', bad_bank: 'גרסה לא קיימת.',
    too_early: 'עוד לא עברו 30 השניות המינימליות לתשובה.'
  };

  function toast(msg, ms = 2600) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), ms);
  }

  // ------------------------------------------------------------ Connexion
  function renderLogin(err) {
    tabs.classList.add('hidden'); chip.classList.add('hidden');
    app.innerHTML = `<form id="lf" class="card" style="margin-top:20px">
      <h1>כניסת מנהל</h1>
      <label for="pw">סיסמה</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <p class="small" style="color:var(--bad);min-height:1em">${esc(err || '')}</p>
      <button class="btn">כניסה</button></form>`;
    document.getElementById('pw').focus();
    document.getElementById('lf').addEventListener('submit', async e => {
      e.preventDefault();
      try {
        const r = await rpc('admin_login', { p_password: document.getElementById('pw').value });
        if (r.error) return renderLogin({ bad_password: 'סיסמה שגויה.', too_many_attempts: 'יותר מדי ניסיונות. נסו שוב בעוד 15 דקות.', no_password_set: 'לא הוגדרה סיסמה (ראו README).' }[r.error] || r.error);
        token = r.token; store.set(KEY, token); markHost(); lastHash = ''; refresh();
      } catch { renderLogin('אין חיבור לשרת.'); }
    });
  }

  // ------------------------------------------------------------ Actions
  async function act(fn, args = {}, okMsg) {
    if (busy) return; busy = true;
    try {
      const r = await rpc(fn, { p_token: token, ...args });
      if (r && r.error === 'too_early') toast(`⏳ ${ERR.too_early} עוד ${Math.ceil(r.remaining_ms / 1000)} שנ׳.`);
      else if (r && r.error) toast(ERR[r.error] || r.error);
      else if (okMsg) toast(okMsg);
      if (navigator.vibrate) navigator.vibrate(20);
      return r;
    } catch (e) {
      if (e.auth && isHost()) toast('🔒 רק המנהל (סיסמה) יכול לעשות את זה.');
      else if (e.auth) { store.del(KEY); token = null; renderLogin('פג תוקף הכניסה.'); }
      else toast('הפעולה נכשלה — אין חיבור. נסו שוב.');
    } finally { busy = false; lastHash = ''; refresh(); }
  }

  // ------------------------------------------------------------ Boucle
  async function refresh() {
    clearTimeout(timer);
    if (!token) return renderLogin();
    try {
      const r = await rpc('admin_state', { p_token: token }, { timeout: 7000 });
      failures = 0; banner.classList.add('hidden');
      offset = Date.parse(r.now) - Date.now();
      S = r;
      store.set('mdl_bank', r.questions);          // copie locale des fiches pour le hors-ligne
      if (S.game?.bank === 'V2' && !loadPhotos._busy && (!P || P._game !== (S.game && S.game.id))) loadPhotos();   // une fois par partie
      render();
    } catch (e) {
      if (e.auth && isHost()) { try { localStorage.removeItem('mdl_access_v1'); } catch {} return location.reload(); } // animateur retiré : retour à la porte
      if (e.auth) { store.del(KEY); token = null; return renderLogin('פג תוקף הכניסה.'); }
      if (++failures >= 2) banner.classList.remove('hidden');
      if (!S && bank().length) renderOfflineBank();
    }
    timer = setTimeout(refresh, document.hidden ? 5000 : 1500);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && token) refresh(); });

  // Fiches photo (privées) : une seule requête, pas à chaque rafraîchissement
  async function loadPhotos(col) {
    if (loadPhotos._busy) return; loadPhotos._busy = true;
    try {
      const r = await rpc('admin_photos', { p_token: token, p_collection: col || gcol || null });
      const changed = !P || !P.collection || !r.collection || P.collection.code !== r.collection.code;
      r._game = S && S.game ? S.game.id : null;
      P = r; store.set('mdl_photos', r);
      if (changed) { gpos = 0; store.set('mdl_gal_pos', 0); }
      lastHash = ''; if (S) render();
    } catch (e) { if (e.auth) { store.del(KEY); token = null; renderLogin('פג תוקף הכניסה.'); } }
    finally { loadPhotos._busy = false; }
  }
  // fiches photo liées à une question (par clé externe)
  const photosOfQ = q => (P && P.photos && q && q.ext_key) ? P.photos.filter(p => (p.question_keys || []).includes(q.ext_key)) : [];

  // ------------------------------------------------------------ Rendu
  function render() {
    tabs.classList.remove('hidden');
    if (view !== 'live') document.body.classList.remove('busmode');
    const rt = document.querySelector('#tab-route');
    if (rt) { const v3 = S.game && routeBank(S.game.bank); rt.querySelector('.i').textContent = v3 ? '🗺️' : '📷'; }
    chip.classList.remove('hidden');
    chip.textContent = (isHost() ? '🚌 מפעיל · ' : '') + `👥 ${S.online}/${S.players}`;
    // Ouverture automatique du panneau micro à la révélation (une seule fois par question)
    if (S.game && S.game.phase === 'revealed' && S.current) {
      const k = S.game.id + ':' + S.current.question_id;
      if (lastAutoGuide !== k) {
        lastAutoGuide = k; store.set('mdl_last_auto_guide', k);
        // en mode bus la phrase du micro est déjà sur l'écran principal : pas de fenêtre en plus
        if (!document.querySelector('.modal') && !(busMode && routeBank(S.game.bank))) openGuide(S.current.question_id, { live: true });
      }
    }
    if (document.querySelector('.modal')) return;          // ne pas perturber l'édition
    const h = view + JSON.stringify(S.game) + JSON.stringify(S.current) + S.online + S.players +
      JSON.stringify(view === 'live' || view === 'questions' || view === 'gallery' ? S.questions : S.leaderboard) + pickId +
      alang + gpos + showAnec + (P && P.collection ? P.collection.code + P.photos.length : '');
    if (h === lastHash) return tickTimer();
    lastHash = h;
    const y = window.scrollY;
    ({ live: renderLive, questions: renderQuestions, gallery: renderGallery, board: renderBoard, settings: renderSettings })[view]();
    window.scrollTo(0, y);
    tickTimer();
  }

  // Durée effective d'une question : la sienne, sinon celle par défaut de la partie
  function timeLabel(sec) {
    if (sec) return sec + ' שנ׳';
    const d = S && S.game ? S.game.default_time_limit_sec : 30;
    return d ? d + ' שנ׳ (ברירת מחדל)' : 'ללא הגבלה';
  }

  // Questions jouables : non utilisées et activées (les alternatives SPARE restent dans leur tiroir)
  const unused = () => S.questions.filter(q => !q.used && q.enabled !== false);
  function nextQuestion() {
    const u = unused();
    return u.find(q => q.id === pickId) || u.find(q => q.selection !== 'SPARE') || u[0] || null;
  }

  function bars(q, showRight) {
    const total = q.counts.reduce((a, b) => a + b, 0) || 1;
    const c = qt(q);
    return c.options.map((o, i) => `<div class="bar c${i} ${showRight && i === q.correct_index ? 'right' : ''}">
      <i style="width:${100 * q.counts[i] / total}%"></i>
      <span><span ${dirOf(c.lang)}>${SHAPES[i]} ${esc(o)} ${i === q.correct_index ? '✔' : ''}</span><span>${q.counts[i]}</span></span></div>`).join('');
  }

  function bankChip() {
    if (!S.game) return '';
    const b = S.game.bank || 'V1';
    if (!knownBank(b)) return `<div class="card center" style="background:#fff6e8"><h2>המשחק הפעיל הוא מהגרסה הקודמת</h2>
      <p class="small">כדי לשחק את מסלול התמונות, צרו משחק חדש.</p><button class="btn sun" data-a="newgame">🔄 משחק חדש</button></div>`;
    const main = S.questions.filter(q => q.selection !== 'SPARE').length;
    const sp = S.questions.filter(q => q.selection === 'SPARE').length;
    return `<div class="row" style="align-items:center;justify-content:space-between;margin-bottom:10px">
      <span class="bankchip v2">${bankIcon(b)} ${esc(bankLabel(b))} · ${main} שאלות${sp ? ` (+${sp} חלופיות)` : ''}</span>
      <div style="flex:none;min-width:150px">${langSeg()}</div></div>`;
  }

  function stats() {
    const g = S.game, c = S.current;
    const phase = { waiting: 'ממתין', open: 'שאלה פתוחה', closed: 'שאלה סגורה', revealed: 'תשובה נחשפה' }[g.phase];
    return bankChip() + `<div class="stats" style="margin-bottom:14px">
      <div class="stat"><b>${S.online}</b><span>מחוברים מ-${S.players}</span></div>
      <div class="stat"><b>${c && g.phase !== 'waiting' ? c.answers : '–'}</b><span>תשובות</span></div>
      <div class="stat"><b style="font-size:17px;line-height:31px">${g.status === 'finished' ? 'הסתיים' : g.paused ? 'מושהה' : phase}</b><span>${S.stats.questions} נחשפו</span></div>
    </div>`;
  }

  // Photo de repérage + métadonnées de trajet d'une question V2 (heure INDICATIVE)
  function routeBlock(q, { big = false } = {}) {
    const m = q && q.route_meta; if (!m || !m.photos) return '';
    const g = gtr(q);
    const ph = photosOfQ(q);
    const col = P && P.collection ? P.collection.code : null;
    const imgs = m.photos.map(f => `<img src="${photoUrl(f, !big, col)}" alt="" loading="lazy" ${big ? 'class="ph"' : ''}>`).join('');
    return `<div class="${big ? '' : 'ph-row'}">${imgs}<div style="flex:1">
      <div class="metagrid">
        <span>🕐 ${esc(m.photoLocalTime || m.routeMarkerTime || '')} <small>(משוער — לא שעת פרסום)</small></span>
        <span>${SIDE[m.side] || esc(m.side || '')}</span>
        <span class="conf-${esc(m.confidence)}">${CONF[m.confidence] || ''}</span>
        ${ph.length ? `<span>📷 ${ph.map(p => '#' + p.ord).join(', ')}</span>` : ''}
      </div>
      ${m.triggerHe ? `<div class="small" dir="rtl">📍 ${esc(m.triggerHe)}</div>` : ''}
      ${m.sectorFr ? `<div class="small muted" dir="ltr" lang="fr">${esc(m.sectorFr)}</div>` : ''}
    </div></div>
    ${g.caution ? `<div class="caution" ${dirOf(gLang(q))}>⚠️ ${esc(g.caution)}</div>` : ''}`;
  }

  // Temps écoulé depuis la dernière publication (objectif : ≥ 2 min entre deux questions — simple repère)
  function sincePub() {
    const c = S.current; if (!c || !c.opened_at) return '';
    return `<p class="timerline" id="sincepub">⏱️ <b>–</b> מאז פרסום השאלה הקודמת · מומלץ 2 דק׳ ומעלה בין שאלות</p>`;
  }

  function nextCard() {
    const n = nextQuestion();
    if (!n) return `<div class="card center"><h2>אין עוד שאלות</h2><p class="muted">כל השאלות הוצגו. אפשר להפעיל שאלה חלופית, להוסיף שאלה או לסיים את המשחק.</p>
      <div class="row"><button class="btn ghost small" data-a="newq">➕ שאלה חדשה</button><button class="btn sun small" data-a="finish">🏁 סיום המשחק</button></div></div>${sparesCard()}`;
    const others = unused().filter(q => q.id !== n.id);
    const c = qt(n);
    return `<div class="card">
      <div class="row" style="justify-content:space-between;align-items:center"><span class="cat">השאלה הבאה · <span ${dirOf(c.lang)}>${esc(c.category)}</span>${n.selection === 'SPARE' ? ' · 🔁 חלופית' : ''}</span>
      <span class="small muted">⏱️ ${timeLabel(n.time_limit_sec)} · ${DIFF[n.difficulty]}</span></div>
      ${n.is_demo ? '<span class="badge demo">הדגמה — לא מאומת</span>' : ''}
      ${routeBlock(n)}
      <div class="question-text" ${dirOf(c.lang)}>${esc(c.text)}</div>

  // Tiroir des questions de remplacement : désactivées par défaut, activables pour CETTE partie
  function sparesCard() {
    const sp = S.questions.filter(q => q.selection === 'SPARE');
    if (!sp.length) return '';
    return `<details class="spares" ${sp.some(q => q.enabled && !q.used) ? 'open' : ''}><summary>🔁 שאלות חלופיות (${sp.length}) — כבויות כברירת מחדל</summary>
      ${sp.map(q => { const c = qt(q); return `<div class="spare">
        ${routeBlock(q)}
        <div style="font-weight:700" ${dirOf(c.lang)}>${esc(c.text)}</div>
        <div class="small" style="color:var(--ok);font-weight:700" ${dirOf(c.lang)}>✔ ${esc(c.options[q.correct_index])}</div>
        <div class="row" style="margin-top:8px">
          ${q.used ? '<span class="badge used">הוצגה</span>'
            : `<button class="btn ${q.enabled ? 'ghost' : 'ok'} small" data-a="spare" data-id="${q.id}" data-on="${q.enabled ? 0 : 1}">${q.enabled ? '⏸️ כיבוי' : '▶️ הפעלה למשחק הזה'}</button>`}
          ${q.enabled && !q.used && S.game.phase !== 'open' && S.game.status !== 'finished' ? `<button class="btn sun small" data-a="open" data-id="${q.id}">📣 פרסם</button>` : ''}
        </div></div>`; }).join('')}
    </details>`;
  }

  function podium(lb) {
    const [a, b, c] = lb;
    const col = (r, cls, m) => r ? `<div class="col ${cls}"><div style="font-size:30px">${m}</div><div class="nm">${esc(r.name)}</div><div class="sc">${r.score} נק׳</div><div class="blk">${r.rank}</div></div>` : '<div class="col"></div>';
    return `<div class="podium">${col(b, 's', '🥈')}${col(a, 'g', '🥇')}${col(c, 'b', '🥉')}</div>`;
  }

  function lbList(rows, opts = {}) {
    return `<ul class="lb">${rows.map(r => `<li class="p${r.rank}">
      ${opts.online ? `<span class="off ${r.online ? 'on' : ''}" title="${r.online ? 'מחובר' : 'לא מחובר'}"></span>` : ''}
      <span class="pos">${r.rank}</span><span class="nm" dir="auto">${esc(r.name)}</span>
      <span class="cr">${r.correct}/${r.answered} ✔</span><span class="sc">${r.score}</span>
      ${opts.remove ? `<button class="iconbtn" data-a="rm" data-id="${r.player_id}" data-name="${esc(r.name)}" title="הסר">✖</button>` : ''}</li>`).join('') || '<li class="muted">אין עדיין משתתפים</li>'}</ul>`;

  function studentLink() { return new URL('play.html', location.href).href; }
  function setBus(on) { busMode = on; store.set('mdl_busmode', on); view = 'live'; setTab(); }
  // le guide envoie le lien dans son groupe WhatsApp
  const WA_MSG = ['🚌 *חידון מורה דרך LIVE מתחיל!*',
    'לאורך הדרך יקפצו שאלות על המקומות שעוברים לידם — תסתכלו מהחלון 👀',
    '⚡ מי שעונה מהר ונכון צובר יותר נקודות, והזוכים יוכרזו במיקרופון 🏆',
    '', '👇 *לוחצים על הקישור, כותבים שם פרטי — ומשחקים:*'].join('\n');
  function waHref() { return 'https://wa.me/?text=' + encodeURIComponent(WA_MSG + '\n' + studentLink()); }
  // Invitation WhatsApp AVEC l'image du QR : un lien wa.me ne transporte que du texte, on passe donc par
  // le partage du téléphone (image + message). Sans partage de fichiers : repli sur le lien wa.me.
  let inviteFile = null;
  function buildInvite() {
    try {
      if (!window.qrcode) return;
      const q = window.qrcode(0, 'M'); q.addData(studentLink()); q.make();
      const n = q.getModuleCount(), cell = Math.floor(560 / (n + 4)), size = cell * (n + 4), W = 720, H = size + 250;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const x = cv.getContext('2d'); if (!x || !cv.toBlob) return;
      x.fillStyle = '#0b4a6b'; x.fillRect(0, 0, W, H);
      x.fillStyle = '#fff'; x.textAlign = 'center'; x.direction = 'rtl';
      x.font = 'bold 44px system-ui, Arial, sans-serif'; x.fillText('🚌 חידון מורה דרך LIVE', W / 2, 70);
      x.font = '30px system-ui, Arial, sans-serif'; x.fillText('סורקים ← כותבים שם פרטי ← משחקים!', W / 2, 120);
      const ox = Math.round((W - size) / 2), oy = 150;   // coordonnées entières : pas de fins liserés entre les cases
      x.fillRect(ox, oy, size, size); x.fillStyle = '#000';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect(ox + (c + 2) * cell, oy + (r + 2) * cell, cell, cell);
      cv.toBlob(b => { if (b) inviteFile = new File([b], 'qr-hidon.png', { type: 'image/png' }); }, 'image/png');
    } catch { /* repli : lien texte */ }
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-share]'); if (!a || !inviteFile) return;
    const data = { files: [inviteFile], text: WA_MSG + '\n' + studentLink() };
    if (!navigator.canShare || !navigator.canShare({ files: data.files })) return;
    e.preventDefault();
    navigator.share(data).catch(err => { if (err && err.name !== 'AbortError') window.open(a.href, '_blank', 'noopener'); });
  }, true);
  buildInvite();

  // Mode solo : partager le parcours V4 de la partie pour que chacun joue seul avec son GPS
  async function soloShare() {
    const code = S && S.game && S.game.bank;

  function tickTimer() {
    const c = S && S.current;
    if (!c || !S.game) return;
    const now = Date.now() + offset;
    const sp = document.getElementById('sincepub');
    if (sp && c.opened_at) {
      const ms = now - Date.parse(c.opened_at);
      sp.querySelector('b').textContent = mmss(ms);
      sp.style.color = ms >= 120000 ? 'var(--ok)' : '';
    }
    if (S.game.phase === 'revealed') {
      const rt = document.getElementById('revtimer');
      if (rt && c.revealed_at) {
        const ms = now - Date.parse(c.revealed_at);
        rt.innerHTML = `🎤 מאז החשיפה: <b>${mmss(ms)}</b> · מיני-הדרכה מומלצת 20–40 שנ׳ — המעבר לשאלה הבאה רק בידיים שלך`;
      }
      return;
    }
    if (S.game.phase !== 'open') return;
    MDL.updateRing(c, offset);
    // temps de réponse minimal (imposé aussi par le serveur) : fermeture normale bloquée avant
    const left = c.can_close_at ? Date.parse(c.can_close_at) - now : 0;
    const cw = document.getElementById('closewait');
    if (cw) cw.innerHTML = left > 0 ? `🔒 אפשר לסגור בעוד <b>${Math.ceil(left / 1000)}</b> שנ׳ (מינימום ${S.game.min_answer_sec} שנ׳ לתשובה)` : '';
    const cb = document.getElementById('closebtn'), rb = document.getElementById('revealbtn'), fb = document.getElementById('forcebtn');
    if (cb) { cb.disabled = left > 0; cb.style.opacity = left > 0 ? .45 : 1; }
    if (rb) rb.disabled = left > 0;
    if (fb) fb.classList.toggle('hidden', !(left > 0));
  }
  setInterval(tickTimer, 250);

  // ------------------------------------------------------------ Panneau micro (privé)
  const paras = t => String(t || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
  let gfs = +(store.get('mdl_guide_fs') || 24);

  function openGuide(qid, { live = false, mode } = {}) {
    G = { open: true, qid, live, mode: mode || 'short' };
    renderGuide();
  }
  function closeGuide() {
    G.open = false;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    document.getElementById('guide-root').innerHTML = '';
  }
  function renderGuide() {
    const root = document.getElementById('guide-root');
    if (!G.open) { root.innerHTML = ''; return; }
    const q = bank().find(x => x.id === G.qid) || (store.get('mdl_v3_bank') || []).find(x => x.id === G.qid);
    const cur = S && S.current && S.current.question_id === G.qid ? S.current : null;
    const src = q || cur;   // question supprimée de la banque : on garde au moins le corrigé
    if (!src) { closeGuide(); return; }
    // V2 : script micro dans la langue admin choisie ; sinon court / long (V1)
    const v2script = q && q.guide_i18n && Object.keys(q.guide_i18n).length ? gtr(q).script : '';
    const hasLong = !!(q && q.guide_long);
    const text = q ? (v2script && G.mode !== 'long' ? v2script : (G.mode === 'long' ? q.guide_long : q.guide_short)) : '';
    const tLang = v2script && G.mode !== 'long' ? gLang(q) : 'he';
    const sc = qt(src);
    const linked = photosOfQ(q);
    const sources = (q && Array.isArray(q.guide_sources)) ? q.guide_sources : [];
    const vis = (q && q.guide_visibility) || 'topic';
    const total = cur && cur.counts ? cur.counts.reduce((a, b) => a + b, 0) : 0;
    const right = cur && cur.counts ? cur.counts[cur.correct_index] : 0;
    const full = root.firstElementChild && root.firstElementChild.classList.contains('full');
    root.innerHTML = `<section class="guide ${full ? 'full' : ''}" id="guide" style="--gfs:${gfs}px" dir="rtl" lang="he">
      <div class="guide-top">
        <h2>🎤 ההדרכה שלי למיקרופון</h2>
        <div style="flex:none;min-width:140px">${langSeg()}</div>
        <button class="iconbtn" data-g="full" title="מסך מלא">⛶</button>
        <button class="iconbtn" data-g="close" title="סגירה">✖</button>
      </div>
      <div class="guide-meta">
        <div class="guide-q" ${dirOf(sc.lang)}>${src.seq ? 'שאלה ' + src.seq + ' · ' : ''}${esc(sc.text)}</div>
        <span class="guide-ans" ${dirOf(sc.lang)}>✔ ${esc(sc.options[src.correct_index])}</span>
        ${cur && total ? `<span class="small muted">&nbsp; ${right}/${total} ענו נכון</span>` : ''}
        <span class="vis ${vis}">${VIS[vis] || VIS.topic}</span>
        ${q && q.guide_location ? `<div class="guide-loc"><b>📍 מתי ואיפה:</b> ${esc(q.guide_location)}</div>` : ''}
      </div>
      ${q && routeBank(q.bank) ? '' : !v2script || hasLong ? `<div class="seg" role="tablist">
        <button data-g="short" class="${G.mode === 'short' ? 'on' : ''}">${v2script ? '🎤 מה להגיד באוטובוס · 20–40 שנ׳' : 'הסבר קצר · 30 שנ׳'}</button>
        <button data-g="long" class="${G.mode === 'long' ? 'on' : ''}">סיפור מורחב · 1–3 דק׳</button>
      </div>` : ''}
      <div class="guide-body" id="guide-body">
        ${q && routeBank(q.bank) ? v3GuideBody(q, sc, sources) : `
        ${v2script && G.mode !== 'long' ? '<div class="small" style="font-weight:800;color:var(--sea);margin-bottom:6px">🎤 מה להגיד באוטובוס · 20–40 שנ׳</div>' : ''}
        <div class="guide-text" ${dirOf(tLang)}>${text ? paras(text) : '<p class="guide-empty">אין עדיין טקסט הדרכה לשאלה הזו. אפשר להוסיף אותו בעריכת השאלה (✏️).</p>'}</div>
        ${q && q.route_meta && q.route_meta.photos ? `<div class="guide-box prac">${routeBlock(q)}</div>` : ''}
        ${sc.explanation ? `<div class="guide-box fact" ${dirOf(sc.lang)}><b class="h">💬 ההסבר שהמשתתפים רואים</b>${paras(sc.explanation)}</div>` : ''}
        ${linked.length ? `<button class="btn ${G.anec ? 'ghost' : 'ok'} small" data-g="anec" style="margin-top:14px">ℹ️ ${ANEC_LBL[alang]} (${linked.length})</button>
          ${G.anec ? linked.map(p => `<div class="anec" ${dirOf(p.anecdote[alang] ? alang : 'he')}><b>📷 #${p.ord}</b> ${esc(p.anecdote[alang] || p.anecdote.he)}</div>`).join('') : ''}` : ''}
        ${q && q.guide_fact ? `<div class="guide-box fact"><b class="h">💡 הידעת?</b>${paras(q.guide_fact)}</div>` : ''}
        ${q && q.guide_practical && G.mode === 'long' ? `<div class="guide-box prac"><b class="h">🧭 מידע מעשי (לבדוק לפני ביקור)</b>${paras(q.guide_practical)}</div>` : ''}
        ${sources.length ? `<details class="guide-src"><summary>📚 מקורות (${sources.length})</summary><ol>${sources.map(s =>
          `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>` : esc(s.title)}</li>`).join('')}</ol></details>` : ''}`}
      </div>
      <div class="guide-bar">
        <button class="iconbtn" data-g="smaller" title="הקטנת טקסט" dir="ltr">A−</button>
        <button class="iconbtn" data-g="bigger" title="הגדלת טקסט" dir="ltr">A+</button>
        ${G.live ? '<button class="btn sun" data-g="next">המשך לשאלה הבאה ▶</button>' : '<button class="btn ghost" data-g="close">סגירה</button>'}

    </section>`;
  }
  // V3 : 🎤 texte micro → 💡 הידעת? → 📍 מתי לדבר? → 📚 מידע נוסף (ordre demandé par le guide)
  function v3GuideBody(q, sc, sources) {
    const g = gtr(q), l = gLang(q);
    const stop = nav && nav.P ? nav.P.stops.find(st => String(q.ext_key || '').split(':').pop() === st.question) : null;
    const nm = o => o ? (o[alang] || o.he || '') : '';
    const fin = q.route_meta && q.route_meta.final;
    return `<div class="small" style="font-weight:800;color:var(--sea);margin-bottom:6px">${fin ? '🎤 סיום ההדרכה' : '🎤 מה להגיד באוטובוס'} · משפט אחד</div>
      <div class="guide-text" ${dirOf(l)}>${paras(g.script)}</div>
      ${Array.isArray((g.more || (q.guide_i18n && q.guide_i18n.he && q.guide_i18n.he.more))) ? `<ul class="busextra" lang="he" dir="rtl">${(g.more || q.guide_i18n.he.more).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${g.long ? `<details class="guide-src"><summary>📖 גרסה מורחבת (אם יש זמן)</summary><div ${dirOf(l)}>${paras(g.long)}</div></details>` : ''}
      ${g.fact ? `<div class="guide-box fact" ${dirOf(l)}><b class="h">💡 הידעת?</b>${paras(g.fact)}</div>` : ''}
      <div class="guide-box prac" ${dirOf(l)}><b class="h">📍 מתי לדבר?</b>${paras(g.cue)}
        ${stop ? `<p>👀 ${esc(nm(stop.look))}</p>
          ${stop.side && stop.side.value ? `<p><b>${stop.side.value === 'left' ? '👈 שמאל' : 'ימין 👉'}</b></p>` : ''}
          ${stop.side && !stop.side.verified && stop.side.docs ? `<p class="small">${esc(nm(stop.side.docs))}</p>` : ''}` : ''}
        ${g.caution ? `<div class="caution">⚠️ ${esc(g.caution)}</div>` : ''}</div>
      ${sc.explanation ? `<div class="guide-box fact" ${dirOf(sc.lang)}><b class="h">💬 ההסבר שהמשתתפים רואים</b>${paras(sc.explanation)}</div>` : ''}
      <details class="guide-src"><summary>📚 מידע נוסף (${sources.length} מקורות)</summary>
        ${q.guide_practical ? `<p class="small" dir="rtl">📄 מה כתוב במסמכי ההדרכה ומה תוקן: ${esc(q.guide_practical)}</p>` : ''}
        <ol>${sources.map(s => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>` : esc(s.title)}</li>`).join('')}</ol></details>`;
  }
  document.getElementById('guide-root').addEventListener('click', e => {
    const b = e.target.closest('[data-g]'); if (!b) return;
    const g = document.getElementById('guide');
    switch (b.dataset.g) {
      case 'short': case 'long':
        G.mode = b.dataset.g; renderGuide(); document.getElementById('guide-body').scrollTop = 0; break;
      case 'bigger': case 'smaller':
        gfs = Math.max(16, Math.min(48, gfs + (b.dataset.g === 'bigger' ? 2 : -2)));
        store.set('mdl_guide_fs', gfs); g.style.setProperty('--gfs', gfs + 'px'); break;
      case 'full':
        if (g.classList.toggle('full')) { if (g.requestFullscreen) g.requestFullscreen().catch(() => {}); }
        else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        break;
      case 'close': closeGuide(); break;
      case 'anec': G.anec = !G.anec; renderGuide(); break;
      case 'next':
        closeGuide(); view = 'live'; setTab();
        setTimeout(() => { const n = document.querySelector('[data-a=open]'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
        break;
    }
  });

  // ------------------------------------------------------------ Nouvelle partie : banques indépendantes V1/V2/V3
  const BANK_INFO = {

  function newGameModal() {

    // toutes les banques installées qui ont des questions (V4, V5… apparaîtront d'elles-mêmes)
    const available = (S?.banks || []).filter(b => Number(b.main || 0) > 0);
    const cur = available.some(b => b.code === 'V3') ? 'V3' : (S?.bank || 'V1');
    root.innerHTML = `<div class="modal"><form class="sheet" id="ngf" autocomplete="off">
      <div class="row" style="align-items:center"><h2 style="margin:0">🔄 משחק חדש</h2><button type="button" class="iconbtn" data-x style="flex:none">✖</button></div>
      <p class="small" style="color:var(--bad);font-weight:700">המשחק הפעיל יסתיים וייפתח משחק חדש עם ניקוד ודירוג משלו; היסטוריית המשחקים הקודמים נשמרת.</p>
      <div class="label" style="font-weight:800">בחירת מסלול</div>
      ${available.map(b => `<label class="optrow" style="align-items:flex-start;background:#fff;border-radius:12px;padding:10px;margin:6px 0">
        <input type="radio" name="bank" value="${esc(b.code)}" ${b.code === cur ? 'checked' : ''} style="width:22px;height:22px;flex:none">
        <span><b>${bankIcon(b.code)} ${esc(b.label?.he || b.code)}</b><br><small class="muted">${esc(BANK_INFO[b.code] || (b.main + ' שאלות' + (b.spare ? ' + ' + b.spare + ' חלופיות' : '')))}</small></span></label>`).join('')}
      ${available.some(b => b.code === 'V3') ? '' : '<p class="small muted">V3 עדיין לא מותקנת במסד הנתונים — הריצו את supabase/migration_v3.sql.</p>'}
      <label>שם המשחק</label>
      <input type="text" name="title" value="מורה דרך LIVE" required>
      <button class="btn sun" style="margin-top:14px">✔ יצירת משחק חדש</button></form></div>`;
    root.onclick = e => { if (e.target.closest('[data-x]')) { root.innerHTML = ''; root.onclick = root.onsubmit = null; lastHash = ''; render(); } };
    root.onsubmit = async e => {
      e.preventDefault();
      const f = e.target, title = f.elements.title.value, code = (f.querySelector('input[name=bank]:checked') || {}).value;
      if (!available.some(b => b.code === code)) return toast('בחרו מסלול');
      root.innerHTML = ''; root.onclick = root.onsubmit = null;
      await act('admin_new_game', { p_title: title, p_bank: code }, 'משחק חדש נוצר ✔');
      pickId = null; P = null; routeMode = false; view = 'live'; setTab();
    };
  }

  // ------------------------------------------------------------ Éditeur
  function editor(q) {
    q = q || { kind: 'mcq', text: '', options: ['', '', '', ''], correct_index: null, explanation: '', category: 'כללי', difficulty: 2, time_limit_sec: null };
    const opts = q.kind === 'tf' ? ['', '', '', ''] : [0, 1, 2, 3].map(i => q.options[i] || '');
    const canPublish = S.game && S.game.phase !== 'open' && S.game.status !== 'finished' && !q.used;
    const root = document.getElementById('modal-root');
    root.onclick = root.onsubmit = null;           // pas d'écouteurs résiduels du choix de partie
    root.innerHTML = `<div class="modal"><form class="sheet" id="qf" autocomplete="off">
      <div class="row" style="align-items:center"><h2 style="margin:0">${q.id ? 'עריכת שאלה' : 'שאלה חדשה'}</h2>
        <button type="button" class="iconbtn" data-x style="flex:none">✖</button></div>
      ${q.used ? '<p class="small badge used">השאלה כבר הוצגה במשחק הנוכחי — השינוי ישפיע רק על משחקים הבאים.</p>' : ''}
      <label>סוג</label>
      <select name="kind"><option value="mcq" ${q.kind === 'mcq' ? 'selected' : ''}>שאלה אמריקאית (עד 4 תשובות)</option><option value="tf" ${q.kind === 'tf' ? 'selected' : ''}>נכון / לא נכון</option></select>
      <label>טקסט השאלה</label>
      <textarea name="text" rows="3" required>${esc(q.text)}</textarea>
      <div id="mcq" class="${q.kind === 'tf' ? 'hidden' : ''}">
        <label>תשובות (סמנו את הנכונה)</label>
        ${opts.map((o, i) => `<div class="optrow"><input type="radio" name="correct" value="${i}" ${q.kind !== 'tf' && q.correct_index === i ? 'checked' : ''}>
          <span class="shape" style="background:var(--a${i})">${SHAPES[i]}</span><input type="text" name="opt${i}" value="${esc(o)}" placeholder="תשובה ${i + 1}${i > 1 ? ' (רשות)' : ''}"></div>`).join('')}
      </div>
      <div id="tf" class="${q.kind === 'tf' ? '' : 'hidden'}">
        <label>התשובה הנכונה</label>
        <div class="row"><label class="optrow"><input type="radio" name="tfc" value="0" ${q.kind === 'tf' && q.correct_index === 0 ? 'checked' : ''}> נכון</label>
        <label class="optrow"><input type="radio" name="tfc" value="1" ${q.kind === 'tf' && q.correct_index === 1 ? 'checked' : ''}> לא נכון</label></div>
      </div>
      <label>הסבר (יוצג אחרי החשיפה)</label>
      <textarea name="explanation" rows="3">${esc(q.explanation)}</textarea>
      <div class="row">
        <div><label>קטגוריה</label><input type="text" name="category" list="cats" value="${esc(q.category)}"><datalist id="cats">${CATS.map(c => `<option value="${c}">`).join('')}</datalist></div>
        <div><label>רמת קושי</label><select name="difficulty">${[1, 2, 3].map(d => `<option value="${d}" ${q.difficulty === d ? 'selected' : ''}>${DIFF[d]}</option>`).join('')}</select></div>
      </div>
      <label>⏱️ זמן מרבי בשניות</label>
      <input type="number" name="time_limit_sec" min="5" max="600" value="${q.time_limit_sec ?? ''}" placeholder="ריק = ברירת המחדל (${timeLabel(null)})">
      <label class="optrow" style="font-weight:600"><input type="checkbox" name="is_demo" ${q.is_demo ? 'checked' : ''} style="width:22px;height:22px"> שאלת הדגמה (לא מאומתת)</label>
      <details ${q.guide_short || q.guide_long ? '' : 'open'} style="margin-top:14px;background:#fff;border-radius:14px;padding:4px 12px 12px">
        <summary style="font-weight:800;padding:8px 0;cursor:pointer">🎤 דף הדרכה למיקרופון (פרטי — רק למנהל)</summary>
        <label>נראות מהאוטובוס</label>
        <select name="guide_visibility">${Object.keys(VIS).map(k => `<option value="${k}" ${(q.guide_visibility || 'topic') === k ? 'selected' : ''}>${VIS[k]}</option>`).join('')}</select>
        <label>📍 מתי להציג ובאיזה צד (רק אם מאומת)</label>
        <textarea name="guide_location" rows="2">${esc(q.guide_location || '')}</textarea>
        <label>הסבר קצר · ~30 שניות</label>
        <textarea name="guide_short" rows="5">${esc(q.guide_short || '')}</textarea>
        <label>סיפור מורחב · 1–3 דקות (שורה ריקה = פסקה חדשה)</label>
        <textarea name="guide_long" rows="10">${esc(q.guide_long || '')}</textarea>
        <label>💡 הידעת?</label>
        <textarea name="guide_fact" rows="3">${esc(q.guide_fact || '')}</textarea>
        <label>🧭 מידע מעשי (שעות, שירותים, גישה לאוטובוס)</label>
        <textarea name="guide_practical" rows="4">${esc(q.guide_practical || '')}</textarea>
        <label>📚 מקורות — שורה לכל מקור: כותרת | קישור</label>
        <textarea name="guide_sources" rows="4" style="direction:rtl">${esc((q.guide_sources || []).map(s => (s.title || '') + (s.url ? ' | ' + s.url : '')).join('\n'))}</textarea>
      </details>
      <p id="qerr" class="small" style="color:var(--bad);min-height:1em"></p>
      <button class="btn">💾 שמירה</button>
      ${canPublish ? '<button type="button" class="btn sun" id="savepub" style="margin-top:10px">💾 שמירה ופרסום מיד</button>' : ''}
    </form></div>`;
    const f = document.getElementById('qf');
    const close = () => { root.innerHTML = ''; lastHash = ''; render(); };
    f.querySelector('[data-x]').addEventListener('click', close);
    f.kind.addEventListener('change', () => {
      document.getElementById('mcq').classList.toggle('hidden', f.kind.value === 'tf');
      document.getElementById('tf').classList.toggle('hidden', f.kind.value !== 'tf');
    });
    async function save(publish) {
      const kind = f.kind.value;
      const raw = [0, 1, 2, 3].map(i => f['opt' + i].value.trim());
      let correct = kind === 'tf' ? (f.tfc.value === '' ? null : +f.tfc.value) : (f.correct.value === '' ? null : +f.correct.value);
      let options = raw;
      if (kind === 'mcq') {
        if (correct !== null && !raw[correct]) correct = null;
        const keep = raw.map((o, i) => o ? i : -1).filter(i => i >= 0);
        options = keep.map(i => raw[i]);
        correct = correct === null ? null : keep.indexOf(correct);
      }
      const err = document.getElementById('qerr');
      if (!f.text.value.trim()) return err.textContent = ERR.text;
      if (kind === 'mcq' && options.length < 2) return err.textContent = ERR.options;
      if (correct === null || correct < 0) return err.textContent = ERR.correct_index;
      const payload = {
        id: q.id || null, kind, text: f.text.value, options, correct_index: correct,
        explanation: f.explanation.value, category: f.category.value, difficulty: +f.difficulty.value,
        time_limit_sec: f.time_limit_sec.value, is_demo: f.is_demo.checked,
        guide_visibility: f.guide_visibility.value, guide_location: f.guide_location.value,
        guide_short: f.guide_short.value, guide_long: f.guide_long.value,
        guide_fact: f.guide_fact.value, guide_practical: f.guide_practical.value,
        guide_sources: f.guide_sources.value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          const i = l.lastIndexOf('|');
          return i > 0 ? { title: l.slice(0, i).trim(), url: l.slice(i + 1).trim() } : (/^https?:/.test(l) ? { title: l, url: l } : { title: l });
        })
      };
      try {
        const r = await rpc('admin_save_question', { p_token: token, p_q: payload });
        if (r.error) return err.textContent = ERR[r.error] || r.error;
        root.innerHTML = '';
        if (publish) { await act('admin_open_question', { p_question_id: r.id }, 'השאלה פורסמה 📣'); view = 'live'; setTab(); }
        else { toast('נשמר ✔'); lastHash = ''; refresh(); }
      } catch { err.textContent = 'השמירה נכשלה — אין חיבור.'; }
    }
    f.addEventListener('submit', e => { e.preventDefault(); save(false); });
    const sp = document.getElementById('savepub'); if (sp) sp.addEventListener('click', () => save(true));
  }

  // ------------------------------------------------------------ Export CSV
  async function exportCsv() {
    try {
      const d = await rpc('admin_export', { p_token: token });
      const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const lines = [['מקום', 'שם', 'ניקוד', 'תשובות נכונות', 'תשובות', 'זמן מצטבר (שנ׳)'].map(cell).join(',')];
      d.leaderboard.forEach(r => lines.push([r.rank, r.name, r.score, r.correct, r.answered, (r.correct_ms / 1000).toFixed(1)].map(cell).join(',')));
      lines.push('');
      lines.push(['שאלה', 'משתתף', 'בחירה', 'נכון?', 'נקודות', 'זמן (שנ׳)'].map(cell).join(','));
      const qmap = Object.fromEntries(d.questions.map(q => [q.seq, q]));
      d.answers.forEach(a => lines.push([a.seq, a.player, (qmap[a.seq] ? qmap[a.seq].options[a.choice] : a.choice), a.correct ? 'כן' : 'לא', a.points, (a.elapsed_ms / 1000).toFixed(2)].map(cell).join(',')));
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'moreh-dereh-live-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      toast('הקובץ ירד ✔');
    } catch { toast('הייצוא נכשל.'); }
  }

  // ------------------------------------------------------------ Événements
  function setTab() {
    tabs.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.view === view));
    lastHash = ''; if (S) render(); window.scrollTo(0, 0);
  }
  tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view = b.dataset.view; setTab(); } });

  app.addEventListener('click', async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, id = +b.dataset.id;
    const q = bank().find(x => x.id === id);
    if (a === 'guide') return openGuide(id, {
      live: !!(S && S.game && S.game.phase === 'revealed' && S.current && S.current.question_id === id) });
    if (!S) return;
    switch (a) {
      case 'open':
        await act('admin_open_question', { p_question_id: id }, 'השאלה פורסמה 📣'); pickId = null;
        if (view !== 'live') { view = 'live'; setTab(); }
        break;
      case 'close': act('admin_close_question'); break;
      case 'reveal': act('admin_reveal'); break;
      case 'pause': act('admin_pause', { p_paused: true }); break;
      case 'unpause': act('admin_pause', { p_paused: false }); break;
      case 'finish':
        if (confirm('לסיים את המשחק ולהציג את הזוכים?')) {
          const r = await act('admin_finish');
          if (r && r.error === 'too_early' && confirm('השאלה פתוחה פחות מהזמן המינימלי. לסיים בכל זאת (חירום)?')) act('admin_finish', { p_force: true });
        } break;
      case 'force':
        if (confirm('סגירת חירום: לסגור את השאלה לפני הזמן המינימלי?\nמשתתפים שעוד לא ענו לא יוכלו לענות.')) act('admin_close_question', { p_force: true }, 'השאלה נסגרה (חירום)');
        break;
      case 'spare': act('admin_toggle_spare', { p_question_id: id, p_on: b.dataset.on === '1' }, b.dataset.on === '1' ? 'השאלה החלופית הופעלה ✔' : 'השאלה החלופית כובתה'); break;
      case 'gpos': gpos = +b.dataset.i; showAnec = false; store.set('mdl_gal_pos', gpos); lastHash = ''; render(); window.scrollTo(0, 0); break;
      case 'gprev': case 'gnext':
        gpos += a === 'gnext' ? 1 : -1; showAnec = false; store.set('mdl_gal_pos', gpos); lastHash = ''; render();
        break;
      case 'anec': showAnec = !showAnec; lastHash = ''; render(); break;
      case 'resume': act('admin_resume_game'); break;
      case 'newgame': newGameModal(); break;
      case 'sim-v3': routeMode = true; view = 'gallery'; setTab(); break;
      case 'route-exit': routeMode = false; view = 'settings'; setTab(); break;
      case 'edit': editor(q); break;
      case 'newq': editor(null); break;
      case 'del': if (confirm('למחוק את השאלה?\n' + q.text)) act('admin_delete_question', { p_id: id }, 'נמחקה'); break;
      case 'up': case 'down': {
        const ids = S.questions.map(x => x.id), i = +b.dataset.i, j = a === 'up' ? i - 1 : i + 1;
        [ids[i], ids[j]] = [ids[j], ids[i]];
        act('admin_reorder', { p_ids: ids }); break;
      }
      case 'rm': if (confirm('להסיר את ' + b.dataset.name + ' מהמשחק?')) act('admin_remove_player', { p_player_id: id }); break;
      case 'export': exportCsv(); break;
      case 'copy':
        try { await navigator.clipboard.writeText(studentLink()); toast('הקישור הועתק ✔'); }
        catch { document.getElementById('slink').select(); toast('סמנו והעתיקו ידנית'); }
        break;
      case 'bus-on': setBus(true); break;
      case 'qr': showQr(); break;
      case 'solo-share': soloShare(); break;
      case 'logout':
        if (isHost()) { try { localStorage.removeItem('mdl_access_v1'); } catch {} location.href = 'index.html'; break; }
        store.del(KEY); token = null; markHost(); renderLogin(); break;
    }
  });

  // langue des contenus admin (questions, scripts micro, anecdotes) — boutons présents dans plusieurs écrans
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-alang]'); if (!b) return;
    alang = b.dataset.alang; store.set('mdl_admin_lang', alang);
    lastHash = ''; if (S) render(); if (G.open) renderGuide();
  });

  // Navigation V3 (GPS / simulation / trace) — module séparé, n'a accès qu'aux actions admin habituelles
  nav = window.MDL_NAV.create({
    getS: () => S, getAlang: () => alang, act, toast, offset: () => offset, qt, waHref, setBus, showQr,
    openGuide: id => openGuide(id, { live: !!(S && S.game && S.game.phase === 'revealed' && S.current && S.current.question_id === id) }),
    rpcBank: b => rpc('admin_bank_questions', { p_token: token, p_bank: b }),
    isOpenable: () => !!(S && S.game && S.game.phase !== 'open' && S.game.status !== 'finished'),
    showRoute: () => { routeMode = !(S && S.game && routeBank(S.game.bank)); view = 'gallery'; setTab(); }
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (token) refresh(); else renderLogin();
})();
</script>
</body>
