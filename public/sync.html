<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>עדכונים אוטומטיים — Moreh Derech NEXT</title>
<style>
:root{--bg:#0b1230;--card:#151f4a;--line:#3d5190;--ink:#eef3ff;--soft:#b5c3ee;--gold:#ffd878;--mint:#6ee9cf;--bad:#ffb4b4;--warn:#ffd28a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI','Arial Hebrew',Arial,sans-serif}
.wrap{max-width:860px;margin:auto;padding:16px 16px 60px}
nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
nav a,.btn{color:var(--ink);text-decoration:none;font-weight:800;font-size:14px;padding:9px 13px;border-radius:12px;background:#1d2a56;border:1px solid #4c5e9a;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5;cursor:default}.btn.gold{background:var(--gold);color:#111d45;border-color:var(--gold)}.btn.ok{background:#1f5e52;border-color:var(--mint)}.btn.no{background:#5e1f2b;border-color:#e58a9a}
h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:0 0 10px}.sub{color:var(--soft);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#0f1840;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.stat span{color:var(--soft);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:#22306a;font-weight:800;font-size:12px}
.tag.success{background:#1f5e52}.tag.partial{background:#6a5a1f}.tag.failed{background:#6a1f2b}.tag.running{background:#1f3f6a}.tag.rolled_back,.tag.skipped{background:#444}
.run{border-top:1px solid #2a3a73;padding:10px 0}.run:first-child{border-top:0}
pre.rep{white-space:pre-wrap;font:13.5px/1.6 inherit;font-family:inherit;background:#0f1840;border-radius:12px;padding:10px;margin:8px 0 0}
.item{border-top:1px solid #2a3a73;padding:10px 0;display:grid;grid-template-columns:auto 1fr;gap:10px}.item:first-child{border-top:0}
.item input{width:20px;height:20px;margin-top:3px}
.q{font-weight:800;margin:0 0 4px}.opts{margin:0;padding-inline-start:18px;color:var(--soft);font-size:14px}.opts li:first-child{color:var(--mint);font-weight:800}
.why{color:var(--warn);font-size:13px;margin:4px 0 0}.quote{color:var(--soft);font-size:13px;margin:4px 0 0;border-inline-start:3px solid var(--line);padding-inline-start:8px}
select,input[type=password]{padding:10px;border-radius:12px;border:1px solid var(--line);background:#0b1232;color:#fff;font:15px inherit;font-family:inherit}
.err{color:var(--bad)}.ok-t{color:var(--mint)}.muted{color:var(--soft);font-size:13px}
.secret{direction:ltr;font-family:ui-monospace,monospace;background:#000;padding:10px;border-radius:10px;word-break:break-all;user-select:all}
a{color:var(--mint)}
.toast{position:fixed;bottom:18px;inset-inline:18px;max-width:520px;margin:auto;background:var(--gold);color:#111d45;font-weight:800;padding:12px 16px;border-radius:14px;box-shadow:0 8px 30px #0008;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="admin.html">🎤 מסך המדריך</a><a href="inbox.html">📨 הודעות</a><a href="index.html">⌂ משחקים</a></nav>
  <h1>🔄 עדכונים אוטומטיים <span class="muted" lang="fr">· Mises à jour automatiques</span></h1>
  <p class="sub">כל יום שלישי ב-08:00 (שיעורים) וכל יום שישי ב-08:00 (סיורים) המערכת סורקת את ה-Drive של בית הספר, מנתחת מסמכים חדשים, ומוסיפה למשחק שאלות, אתרים ותאריכים — רק מה שמופיע במסמכים. מה שלא אומת עובר לאישורכם כאן.</p>
  <div id="app"><div class="card">טוען…</div></div>
</div>
<script src="config.js"></script>
<script src="api.js"></script>
<script type="module">
import { nextRuns, MODE_LABEL, END_DATE } from './sync-schedule.js';
const { rpc, esc, store } = window.MDL;
const KEY = 'mdl_admin';
let token = store.get(KEY), D = null, openRun = null, runDetail = {}, sel = new Set(), secretShown = '';
const app = document.getElementById('app');
const KIND = { question: '❓ שאלה', open_question: '✍️ שאלה פתוחה', site: '📍 אתר', event: '⏳ תאריך', route: '🛣️ סיפור דרך', correction: '🛠️ תיקון', contradiction: '⚖️ סתירה', concept: '📘 מושג' };
const ST = { success: 'הצליח', partial: 'הצליח חלקית', failed: 'נכשל', running: 'בתהליך', rolled_back: 'בוטל', skipped: 'דולג' };
const LV = { 1: 'קל', 2: 'בינוני', 3: 'קשה' };
const when = iso => { try { return new Date(iso).toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem', dateStyle: 'medium', timeStyle: 'short' }); } catch { return iso || ''; } };
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 4200); }

function login(err) {
  app.innerHTML = `<form class="card" id="lf"><label for="pw"><b>סיסמת מנהל</b></label><p><input id="pw" type="password" autocomplete="current-password" required style="width:100%"></p>
    <p class="err">${esc(err || '')}</p><button class="btn gold">כניסה</button></form>`;
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await rpc('admin_login', { p_password: document.getElementById('pw').value });
      if (r.error) return login({ bad_password: 'סיסמה שגויה.', too_many_attempts: 'יותר מדי ניסיונות. נסו שוב בעוד 15 דקות.' }[r.error] || r.error);
      token = r.token; store.set(KEY, token); load();
    } catch { login('אין חיבור לשרת.'); }
  };
}

async function load() {
  if (!token) return login();
  try { D = await rpc('admin_sync_overview', { p_token: token }, { timeout: 12000 }); render(); }
  catch (e) {
    if (e.auth) { store.del(KEY); token = null; return login('פג תוקף הכניסה.'); }
    app.innerHTML = `<div class="card"><p>לא ניתן לטעון את העדכונים.</p><p class="muted">בפעם הראשונה: להריץ פעם אחת את <b>supabase/auto_sync.sql</b> ב-Supabase › SQL Editor (ראו docs/AUTO_SYNC.md).</p><button class="btn" id="rt">↻ לנסות שוב</button></div>`;
    document.getElementById('rt').onclick = load;
  }
}

function itemHtml(i) {
  const p = i.payload || {}, src = p.source ? `<a href="${esc(p.source.url)}" target="_blank" rel="noopener">${esc(p.source.label)}</a>` : '';
  let body = '';
  if (i.kind === 'question') body = `<p class="q">${esc(p.q)}</p><ol class="opts">${(p.a || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol><p class="muted">${LV[p.level] || ''} · ${esc(p.type || 'mcq')} · ${esc(p.stop || '')} — ${esc(p.e || '')}</p>`;
  else if (i.kind === 'open_question') body = `<p class="q">${esc(p.q)}</p><p class="muted">תשובת ייחוס: ${esc(p.answer)}</p><ul class="opts">${(p.points || []).map(x => `<li style="color:var(--soft);font-weight:400">${esc(x)}</li>`).join('')}</ul>`;
  else if (i.kind === 'site') body = `<p class="q">${esc(p.name_he)}</p><p class="muted">ויקיפדיה: ${esc(p.wiki_he || p.wiki_en || '—')} · ${esc(p.kind)}</p>`;
  else if (i.kind === 'event') body = `<p class="q">${esc(p.title)} — ${esc(p.yearText)}</p><p class="muted">${esc(p.period)} · ${esc(p.desc || '')}</p>`;
  else if (i.kind === 'route') body = `<p class="q">${esc(p.from || '')} ← ${esc(p.to || '')}</p><p class="muted">${(p.stops || []).map(s => esc(s.name) + (s.side && s.side !== 'unknown' ? ` (${s.side === 'right' ? 'ימין' : s.side === 'left' ? 'שמאל' : 'קדימה'})` : '')).join(' · ')}</p>`;
  else if (i.kind === 'correction') body = `<p class="q">${esc(p.existing_id)}: ${esc(p.issue)}</p><p class="muted">תיקון מוצע: ${esc(p.corrected_answer || '')}</p>`;
  else if (i.kind === 'contradiction') body = `<p class="q">${esc(p.topic)}</p><p class="muted">במסמך: ${esc(p.claim_doc)}${p.claim_existing ? ' · קיים: ' + esc(p.claim_existing) : ''}</p>`;
  else body = `<pre class="rep">${esc(JSON.stringify(p, null, 1))}</pre>`;
  return `<div class="item"><input type="checkbox" data-sel="${esc(i.id)}" ${sel.has(i.id) ? 'checked' : ''} aria-label="בחירה"><div>
    <div class="row"><span class="tag">${KIND[i.kind] || esc(i.kind)}</span>${i.tour_id ? `<span class="tag">סיור ${esc(i.tour_id)}</span>` : ''}${i.status === 'approved' ? '<span class="tag success">אושר — יפורסם</span>' : ''}<span class="muted">${when(i.created_at)}</span></div>
    ${body}${i.reason ? `<p class="why">⚠️ ${esc(i.reason)}</p>` : ''}${p.quote ? `<p class="quote">„${esc(p.quote)}”</p>` : ''}${src ? `<p class="muted">📄 ${src}</p>` : ''}</div></div>`;
}

function render() {
  const c = D.config || {}, runs = D.runs || [], last = runs.find(r => r.kind !== 'publish' && r.kind !== 'rollback');
  const next = c.paused ? [] : nextRuns(new Date(), 2, c.end_date || END_DATE);
  const pend = (D.pending || []).filter(i => i.status === 'pending'), appr = (D.pending || []).filter(i => i.status === 'approved');
  const errs = (D.files && D.files.errors) || [];
  app.innerHTML = `
  ${c.has_secret ? '' : `<div class="card" style="border-color:var(--gold)"><h2>🔑 שלב הגדרה: מפתח סנכרון</h2>
     <p class="muted">הרובוט (GitHub) צריך מפתח כדי לכתוב כאן את הדוחות. צרו אותו והעתיקו אותו ל-GitHub › Settings › Secrets › <b>SYNC_SECRET</b>. המפתח מוצג פעם אחת בלבד.</p>
     ${secretShown ? `<p class="secret">${esc(secretShown)}</p>` : '<button class="btn gold" id="mkSecret">צור מפתח סנכרון</button>'}</div>`}
  <div class="card"><h2>מצב</h2><div class="grid">
    <div class="stat"><span>סנכרון אחרון</span><b>${last ? when(last.started_at) : '—'}</b>${last ? `<span class="tag ${esc(last.status)}">${ST[last.status] || esc(last.status)}</span>` : ''}</div>
    <div class="stat"><span>הסנכרון הבא</span><b>${next[0] ? when(next[0].at) : c.paused ? 'מושהה' : 'הסתיים'}</b><span>${next[0] ? esc(MODE_LABEL[next[0].mode]) : ''}</span></div>
    <div class="stat"><span>ממתינים לאישור</span><b>${pend.length}</b><span>${appr.length ? appr.length + ' אושרו, טרם פורסמו' : ''}</span></div>
    <div class="stat"><span>מסמכים במעקב</span><b>${(D.files && D.files.total) || 0}</b><span>${errs.length ? errs.length + ' בשגיאה' : 'אין שגיאות'}</span></div>
  </div>
  <p class="muted">${next[1] ? 'ואחריו: ' + when(next[1].at) + ' · ' : ''}עדכונים מתוכננים עד ${esc(c.end_date || END_DATE)} (כולל). אחר כך הם נעצרים, והתוכן שנוסף נשאר.</p>
  <div class="row" style="margin-top:10px">
    <select id="mode" aria-label="סוג סנכרון"><option value="all">סנכרון מלא</option><option value="courses">שיעורים</option><option value="tours">סיורים</option></select>
    <button class="btn gold" id="syncNow">🔄 סנכרן עכשיו <span lang="fr" class="muted" style="color:#111d45">Synchroniser maintenant</span></button>
    ${appr.length ? `<button class="btn ok" id="publish">📣 פרסם ${appr.length} פריטים שאושרו</button>` : ''}
  </div>
  <div class="row" style="margin-top:10px">
    <label class="muted"><input type="checkbox" id="paused" ${c.paused ? 'checked' : ''}> השהיית העדכונים המתוזמנים</label>
    <label class="muted"><input type="checkbox" id="review" ${c.publish_mode === 'review' ? 'checked' : ''}> תצוגה מקדימה: לא לפרסם שום דבר בלי אישורי</label>
  </div></div>

  <div class="card"><h2>🕓 ממתינים לאישור (${pend.length + appr.length})</h2>
    ${pend.length + appr.length ? `<div class="row" style="margin-bottom:8px"><button class="btn" id="selAll">בחר הכול</button><button class="btn ok" data-dec="approved">✓ לאשר</button><button class="btn no" data-dec="rejected">✕ לדחות</button><button class="btn" data-dec="pending">↩ להחזיר להמתנה</button></div>
      <p class="muted">אישור = הפריט יתפרסם בלחיצה על „פרסם” (או בעדכון הבא). תיקונים וסתירות לא משנים שום דבר אוטומטית: אחרי שבדקתם, תקנו בקובץ המקור.</p>
      ${[...appr, ...pend].map(itemHtml).join('')}` : '<p class="muted">אין פריטים שממתינים 🎉</p>'}</div>

  <div class="card"><h2>📋 היסטוריה ודוחות</h2>
    ${runs.length ? runs.map(r => `<div class="run"><div class="row"><span class="tag ${esc(r.status)}">${ST[r.status] || esc(r.status)}</span><b>${when(r.started_at)}</b>
      <span class="muted">${esc(MODE_LABEL[r.kind] || r.kind)}${r.trigger === 'manual' ? ' · ידני' : r.trigger === 'fallback' ? ' · גיבוי' : ''}${r.dry_run ? ' · ניסיון' : ''}</span></div>
      <p class="muted">📄 ${r.docs_scanned} נסרקו · ${r.docs_new} חדשים · ${r.docs_changed} עודכנו · ❓ ${r.questions_created} שאלות · 📍 ${r.sites_added} אתרים · 🛠️ ${r.questions_corrected} תיקונים · 🕓 ${r.pending_count} לאישור${(r.errors || []).length ? ` · <span class="err">${r.errors.length} שגיאות</span>` : ''}</p>
      <div class="row"><button class="btn" data-rep="${esc(r.id)}">${openRun === r.id ? 'הסתר דוח' : 'דוח עדכון'}</button>
      ${r.commit_sha && ['success', 'partial'].includes(r.status) ? `<button class="btn no" data-undo="${esc(r.id)}">↶ ביטול העדכון</button>` : ''}
      ${r.github_run_url ? `<a class="btn" href="${esc(r.github_run_url)}" target="_blank" rel="noopener">יומן טכני</a>` : ''}</div>
      ${openRun === r.id ? `<pre class="rep">${esc(r.report_he || '')}</pre>` : ''}</div>`).join('') : '<p class="muted">עדיין לא היה סנכרון.</p>'}</div>

  ${errs.length ? `<div class="card"><h2>❌ מסמכים בשגיאה</h2>${errs.map(e => `<p class="muted"><b>${esc(e.path || e.title)}</b> — ${esc(e.error)} (ניסיון ${e.attempts}/3)</p>`).join('')}</div>` : ''}`;
}

async function request(action, extra = {}) {
  try {
    const r = await fetch('/api/sync/request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, action, ...extra }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 404) return toast('הכפתור פועל רק בכתובת Cloudflare (moreh-derech-next.lebrati.workers.dev).');
    if (j.error === 'already_running') return toast('סנכרון כבר רץ — נסו שוב בעוד כמה דקות.');
    if (j.error === 'not_authorized') { store.del(KEY); token = null; return login('פג תוקף הכניסה.'); }
    if (!r.ok) return toast('לא הצלחנו להפעיל: ' + (j.error || r.status) + (j.error === 'dispatch_failed' ? ' (בדקו את GITHUB_TOKEN ב-Cloudflare)' : ''));
    toast(action === 'sync' ? 'הסנכרון התחיל ✔ הדוח יופיע כאן בעוד כמה דקות.' : action === 'publish' ? 'הפרסום התחיל ✔' : 'הביטול התחיל ✔');
    setTimeout(load, 8000);
  } catch { toast('אין חיבור לשרת.'); }
}

app.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'mkSecret') {
    if (!confirm('ליצור מפתח חדש? אם כבר הוגדר מפתח ב-GitHub, יהיה צריך להחליף אותו.')) return;
    const r = await rpc('admin_sync_new_secret', { p_token: token }); secretShown = r.secret; D.config.has_secret = false; render();
    toast('העתיקו את המפתח עכשיו — הוא לא יוצג שוב.'); return;
  }
  if (b.id === 'syncNow') return request('sync', { mode: document.getElementById('mode').value });
  if (b.id === 'publish') return request('publish');
  if (b.id === 'selAll') { (D.pending || []).forEach(i => sel.add(i.id)); return render(); }
  if (b.dataset.dec) {
    if (!sel.size) return toast('בחרו קודם פריטים.');
    await rpc('admin_sync_decide', { p_token: token, p_ids: [...sel], p_decision: b.dataset.dec, p_note: '' });
    sel.clear(); toast('נשמר ✔'); return load();
  }
  if (b.dataset.rep) { openRun = openRun === b.dataset.rep ? null : b.dataset.rep; return render(); }
  if (b.dataset.undo) {
    if (!confirm('לבטל את כל מה שהעדכון הזה הוסיף למשחק? (שאלות, אתרים ותאריכים שלו יוסרו; שום דבר אחר לא ישתנה)')) return;
    return request('rollback', { runId: b.dataset.undo });
  }
});
app.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.sel) { t.checked ? sel.add(t.dataset.sel) : sel.delete(t.dataset.sel); return; }
  if (t.id === 'paused' || t.id === 'review') {
    await rpc('admin_sync_settings', { p_token: token, p_paused: document.getElementById('paused').checked, p_publish_mode: document.getElementById('review').checked ? 'review' : 'auto' });
    toast('נשמר ✔'); load();
  }
});
load();
</script>
</body>
</html>
